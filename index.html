<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI拍檔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<style>
/* Layout: Uber-style look — black bar, white page, flat grey tiles instead of shadowed cards; each side keeps its own colour (搵人 coral, 搵工 cerulean) on the bar, buttons, selections and progress so you always know which side you are on */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --tile: #F3F3F3;
  --tile-2: #E8E8E8;
  --ink: #000000;
  --muted: #5E5E5E;
  --line: #E2E2E2;
  --shadow: none;
  --accent: #000000;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3F3F3;
  --signal: #8A5A00;
  --signal-soft: #FFF3D6;
  --star: #000000;
  --boss: #D7424E; --boss-ink: #FFFFFF; --boss-soft: #FCE7E9; --boss-top: #FF7B86;
  --worker: #0874AB; --worker-ink: #FFFFFF; --worker-soft: #E1F0F8; --worker-top: #5CB8EA;
  --top-bg: #000000; --top-ink: #FFFFFF; --top-muted: #CBCBCB; --top-line: #333333; --top-tile: #1F1F1F;
  --danger: #D1302A;
  --need: #0F766E; --need-ink: #FFFFFF; --need-soft: #E3F4F1;
  --f-body: "Noto Sans HK", "Figtree", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --f-display: "Figtree", "Noto Sans HK", "PingFang HK", system-ui, sans-serif;
  --f-num: "Figtree", "Noto Sans HK", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #000000; --tile: #1F1F1F; --tile-2: #2B2B2B; --ink: #FFFFFF; --muted: #AFAFAF; --line: #2E2E2E;
    --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #1F1F1F;
    --signal: #F0BC52; --signal-soft: #2D2513; --star: #FFFFFF;
    --boss: #FF7B86; --boss-ink: #2A070B; --boss-soft: #3A1A20;
    --worker: #5CB8EA; --worker-ink: #04192A; --worker-soft: #12293A;
    --top-bg: #000000; --top-line: #333333; --top-tile: #1F1F1F; --danger: #FF7A6E;
  --need: #5EC2B0; --need-ink: #04201C; --need-soft: #0E2A27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #000000; --tile: #1F1F1F; --tile-2: #2B2B2B; --ink: #FFFFFF; --muted: #AFAFAF; --line: #2E2E2E;
  --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #1F1F1F;
  --signal: #F0BC52; --signal-soft: #2D2513; --star: #FFFFFF;
  --boss: #FF7B86; --boss-ink: #2A070B; --boss-soft: #3A1A20;
  --worker: #5CB8EA; --worker-ink: #04192A; --worker-soft: #12293A;
  --top-bg: #000000; --top-line: #333333; --top-tile: #1F1F1F; --danger: #FF7A6E;
  --need: #5EC2B0; --need-ink: #04201C; --need-soft: #0E2A27;
  color-scheme: dark;
}
body[data-side="boss"] { --accent: var(--boss); --accent-ink: var(--boss-ink); --accent-soft: var(--boss-soft); --side: var(--boss-top); }
body[data-side="worker"] { --accent: var(--worker); --accent-ink: var(--worker-ink); --accent-soft: var(--worker-soft); --side: var(--worker-top); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--top-bg); }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 900; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--top-bg); color: var(--top-ink); box-shadow: inset 0 -3px 0 var(--accent), 0 4px 16px -8px rgba(20, 33, 61, .4); }
.top :focus-visible { outline-color: var(--top-ink); }
.top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px 20px; padding-block: 10px; }
.top .logo { justify-self: start; }
.top .role { justify-self: center; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 10px; }
.gbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.gbtn:hover { border-color: var(--muted); }
.gbtn svg { width: 18px; height: 18px; flex: none; }
.g-btn { min-height: 44px; display: flex; justify-content: center; }
.gbtn.big { width: 100%; justify-content: center; padding: 11px 16px; font-size: 16px; border-radius: 10px; }
.me-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--top-line); background: transparent; color: var(--top-ink); border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.me-btn .avatar { width: 30px; height: 30px; font-size: 14px; }
#account { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--top-line); background: transparent; color: var(--top-ink); cursor: pointer; }
.bell .count { position: absolute; top: -4px; right: -6px; background: var(--accent); color: var(--accent-ink); }
.note-item { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; }
.note-item.unread { background: var(--accent-soft); font-weight: 700; }
.acc-list { display: grid; gap: 8px; }
.acc { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.acc:hover { border-color: var(--accent); }
.acc .avatar { width: 36px; height: 36px; }
.rating-sec { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.rating-sum { display: flex; align-items: center; gap: 12px; }
.rating-sum > b { font-size: 34px; line-height: 1; }
.rating-sum .stars-text { font-size: 18px; }
.review-list { display: grid; gap: 8px; }
.login-page { min-height: calc(100vh - 200px); min-height: calc(100dvh - 200px); display: grid; place-items: center; padding-block: 32px; }
.login-wrap { position: relative; display: grid; width: min(100%, 440px); }
.login-wrap.wide { width: min(100%, 720px); }
.login-x { position: absolute; top: 10px; right: 10px; z-index: 1; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; }
.login-x:hover { background: var(--bg); color: var(--ink); }
.login-page { cursor: default; }
.login-card { width: 100%; display: grid; gap: 16px; padding: 28px 24px; }
.login-card h1 { font-size: 26px; }
.login-card .link { justify-self: center; }
.setup-card .group { gap: 8px; }
.field-title { font-weight: 700; font-size: 15px; }
.req { color: var(--danger); margin-left: 2px; }
.err { color: var(--danger); font-size: 13px; }
.setup-card .tier-card .small { color: var(--muted); }
.setup-card .tier-card .tier { justify-self: start; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.role { display: inline-flex; gap: 8px; }
.role button { border: 2px solid var(--c); background: transparent; color: var(--c); padding: 7px 22px; border-radius: 999px; cursor: pointer; font-size: 17px; font-weight: 900; white-space: nowrap; transition: background .15s ease, color .15s ease; }
.role button[data-role="boss"] { --c: var(--boss-top); }
.role button[data-role="worker"] { --c: var(--worker-top); }
.role button:hover { background: color-mix(in srgb, var(--c) 16%, transparent); }
.role button[aria-pressed="true"] { background: var(--c); color: var(--top-bg); box-shadow: 0 6px 18px -6px var(--c); }

.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--signal-soft); color: var(--signal); font-size: 12px; font-family: var(--f-num); }
@media (max-width: 900px) {
  .top-right { display: contents; }
  .top #account { grid-column: 3; grid-row: 1; justify-self: end; }
  .top .nav { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
}
@media (max-width: 560px) { .me-btn .long { display: none; } .me-btn { padding: 3px; } }
@media (max-width: 420px) { .role button { padding: 6px 14px; font-size: 15.5px; } }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 19px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--top-ink); }
.logo-mark { width: 28px; height: 20px; position: relative; flex: none; }
.logo-mark::before, .logo-mark::after { content: ""; position: absolute; top: 0; width: 20px; height: 20px; border-radius: 50%; }
.logo-mark::before { left: 0; background: var(--boss-top); }
.logo-mark::after { right: 0; background: var(--worker-top); opacity: .9; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 7px 14px; font-weight: 500; border-radius: 999px; cursor: pointer; color: var(--top-muted); white-space: nowrap; }
.nav button:hover { color: var(--top-ink); }
.nav button[aria-current="page"] { color: var(--top-ink); background: rgba(255, 255, 255, .14); }
.nav .count { background: rgba(255, 255, 255, .14); color: var(--top-ink); }
.nav button[aria-current="page"] .count { background: var(--accent); color: var(--accent-ink); }
body[data-side="boss"] .nav button[aria-current="page"] .count { background: var(--boss-top); color: var(--top-bg); }
body[data-side="worker"] .nav button[aria-current="page"] .count { background: var(--worker-top); color: var(--top-bg); }
@media (max-width: 420px) { .logo-text { display: none; } .nav button { padding: 7px 10px; } }

main { padding-block: 28px 64px; display: grid; gap: 28px; }
.view { display: grid; gap: 24px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; font-weight: 700; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary { box-shadow: 0 4px 12px -6px var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
textarea, input[type="text"], input[type="number"], input[type="tel"], select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
textarea { resize: vertical; min-height: 76px; }
textarea:focus, input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ask-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* wide screens: action column on the left stays put, the list fills the rest */
.split { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }
.split > .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 16px; min-width: 0; }
.split > .main { display: grid; gap: 12px; min-width: 0; }
@media (max-width: 980px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .side { position: static; }
}
.side .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.side .fields:not(.pair) label:first-child { grid-column: 1 / -1; }
.fields.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.h-side { font-size: clamp(24px, 3vw, 30px); }
.field-label { font-size: 13px; color: var(--muted); }
.tabs .chip { font-size: 14px; padding: 5px 14px; }
.pill { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.waiting { color: var(--signal); }
.pill.accepted { color: var(--accent); }
.pill.declined { color: var(--muted); }
.person { display: flex; gap: 12px; align-items: center; min-width: 0; }
.hard { margin: 4px 0 0; padding-left: 1.2em; font-size: 14px; }
.hard li::marker { color: var(--signal); }
.tier { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; vertical-align: 2px; white-space: nowrap; }
.tier.master { background: var(--signal-soft); color: var(--signal); }
.tier.mid { background: var(--accent-soft); color: var(--accent); }
.tier.backup { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tier-card { display: grid; gap: 6px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; cursor: pointer; }
.tier-card:hover { border-color: var(--accent); }
@media (max-width: 700px) { .tiers { grid-template-columns: minmax(0, 1fr); } }
.modes { display: grid; gap: 8px; }
.modes label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.modes label > span { display: grid; gap: 2px; }
.modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.modes input { margin-top: 4px; accent-color: var(--accent); }
.trial-tag { color: var(--signal); font-weight: 700; }
.trial-box { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 6px; }
.subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.sub { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: grid; align-content: start; min-width: 0; }
.sub.passed { opacity: .5; }
.sub-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; background: var(--bg); }
.sub-media:empty { display: none; }
.sub-media img, .sub-media video { display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.sub-media audio { width: 100%; padding: 8px; }
.file-name { padding: 12px; font-size: 13px; overflow-wrap: anywhere; }
.sub-body { padding: 12px 14px; display: grid; gap: 8px; }
.drop { display: grid; gap: 4px; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop input { font-size: 13px; max-width: 100%; }
.snip { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.row-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
@media (max-width: 700px) { .row-tags { display: none; } }

.step { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.step > span:first-child { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-family: var(--f-num); }
.group { display: grid; gap: 6px; }
.fields.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.side .fields.trio label:first-child { grid-column: auto; }
.tier-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button.row { width: 100%; background: var(--surface); border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.row:first-child { border-top: 0; }
.need-item[aria-current="true"] { background: var(--accent-soft); }
.need-item:hover h3 { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.reviews { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.review { display: grid; gap: 4px; align-content: start; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.stars-text { color: var(--star); letter-spacing: 2px; }
.stars-text .off { color: var(--line); }
.stars.big button { font-size: 32px; }
.stats b { font-size: 24px; }
@media (max-width: 560px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.empty { justify-items: start; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tag-direct { color: var(--accent); font-weight: 700; }

/* rows */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.row-main { display: flex; gap: 12px; align-items: center; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.row-main > div { min-width: 0; }
.row-main:hover h3 { color: var(--accent); }
.row-side { display: flex; align-items: center; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; color: var(--muted); }
.price { font-family: var(--f-num); font-weight: 700; white-space: nowrap; }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row-side { justify-content: space-between; }
}
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.big { width: 72px; height: 72px; font-size: 28px; }
/* uploads, thumbnails and the big-picture viewer */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; min-width: 0; }
.gal.big { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.thumb { position: relative; display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); color: var(--ink); cursor: zoom-in; aspect-ratio: 4 / 3; text-align: left; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .play { position: absolute; left: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; }
.thumb .doc { display: grid; gap: 2px; align-content: center; height: 100%; padding: 8px 10px; font-size: 12px; min-width: 0; }
.thumb .doc b { color: var(--accent); font-family: var(--f-num); font-size: 14px; }
.thumb .doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 5px; font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .72)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb:hover { border-color: var(--accent); }
.thumb[aria-pressed] { cursor: pointer; }
.thumb[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumb[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.gal-more { aspect-ratio: 4 / 3; border: 1px dashed var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); font-weight: 700; cursor: zoom-in; }
.upl { display: grid; gap: 8px; min-width: 0; }
.upl.over .drop { border-color: var(--accent); background: var(--bg); }

  const CN_NUM = { "一": 1, "兩": 2, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };
  // amounts followed by a counter (2 萬份, 5,000 張) are quantities, not money; take the largest money amount
  const COUNTER = "(?![\\d,]|\\s*[份張個條件人次篇間架部款位])";
  function parseBudget(text) {
    const found = [];
    const money = new RegExp("(?:HK\\$|\\$|港幣)\\s*([\\d,]+(?:\\.\\d+)?)\\s*(k|K|千|萬)?" + COUNTER + "|([\\d,]+(?:\\.\\d+)?)\\s*(k|K|千|萬|蚊|元)" + COUNTER, "g");
    for (const m of text.matchAll(money)) {
      let n = parseFloat((m[1] || m[3]).replace(/,/g, ""));
      const unit = m[2] || m[4] || "";
      if (/k|K|千/.test(unit)) n *= 1000;
      if (unit === "萬") n *= 10000;
      found.push(Math.round(n));
    }
    // 「預算 3000」: a bare number right after 預算 is money too
    for (const m of text.matchAll(/預算\s*(?:大約|約)?\s*([\d,]{3,})(?![\d,]|\s*[份張個條件人次篇間架部款位kK千萬蚊元])/g)) found.push(parseInt(m[1].replace(/,/g, ""), 10));
    for (const m of text.matchAll(new RegExp("([一兩二三四五六七八九十]+)\\s*(千|萬)" + COUNTER, "g"))) {
      const n = m[1].length === 2 && m[1][0] === "十" ? 10 + CN_NUM[m[1][1]] : m[1].length === 2 && m[1][1] === "十" ? CN_NUM[m[1][0]] * 10 : CN_NUM[m[1]];
      if (n) found.push(n * (m[2] === "萬" ? 10000 : 1000));

  }
  function parseDays(text) {

    if (!m) return null;
    const n = /\d/.test(m[1]) ? parseInt(m[1], 10) : CN_NUM[m[1]];
    if (/星期|週|禮拜/.test(m[2])) return n * 7;
    if (/月/.test(m[2])) return n * 30;
    return n;
  }
  function detectCat(text) {

  function titleFrom(raw, cat) {

      .replace(/(\d+|[一兩二三四五六七八九十])\s*(日|天|個星期|星期|週|個禮拜|禮拜|個月|月)\s*(內|之內)?/g, "")

  // matching: skills 45, tier 15, budget 15, rating 15, availability 10
  function match(job, t) {
    const need = job.skills.length ? job.skills : catById(job.cat).skills.slice(0, 3);
    const hit = need.filter(s => t.skills.includes(s));
    let skill = hit.length / need.length;
    if (t.cat === job.cat) skill = Math.min(1, skill + 0.25);
    const budget = job.budget >= t.rate[0] ? 1 : Math.max(0, job.budget / t.rate[0]);
    const rating = Math.max(0, Math.min(1, t.rating - 4));

    const tier = TIER_FIT[job.tier || "mid"][t.tier || "mid"];
    const total = Math.min(99, Math.round(45 * skill + 15 * tier + 15 * budget + 15 * rating + 10 * avail));

  // stand-in pictures for the made-up examples: a gradient, a few shapes and a caption
  const PIC_TINTS = ["#F4E6C8", "#E3ECF7", "#F6DCE0", "#DDEFE5"];
  function samplePic(hue, label, seed) {
    try {
      const k = seed || [...label].reduce((a, ch) => a + ch.charCodeAt(0), 0);
      const c = document.createElement("canvas"); c.width = 480; c.height = 360;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 480, 360);
      grad.addColorStop(0, hue); grad.addColorStop(1, PIC_TINTS[k % 4]);
      g.fillStyle = grad; g.fillRect(0, 0, 480, 360);

  function shrink(file, max) {

  let LB = null;
  function openLB(key) {
    const [g, i] = key.split(":").map(Number);
    if (!GAL[g] || !GAL[g][i]) return;
    LB = { files: GAL[g], i, back: document.activeElement };
    drawLB();
  }
  function drawLB() {
    let el = $("#lb");
    if (!el) {
      el = document.createElement("div");
      el.id = "lb"; el.className = "lb"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "睇大");
      document.body.appendChild(el);
      el.addEventListener("click", e => { if (e.target === el || e.target.classList.contains("lb-stage")) closeLB(); });
      let x0 = null;
      el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
      el.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1); });
    }
    const f = LB.files[LB.i], n = LB.files.length;
    const media = isImg(f) ? `<img src="${f.url}" alt="${esc(f.cap || f.name)}">`
      : isVid(f) ? `<video src="${f.url}" controls autoplay playsinline></video>`
      : `<div class="lb-doc"><b>${esc(extOf(f))}</b><span>${esc(f.name)}</span><span class="small muted">${sizeText(f.size)}</span>
          ${isAud(f) ? `<audio src="${f.url}" controls autoplay></audio>` : ""}
          ${f.url ? `<a class="btn btn-primary" href="${f.url}" download="${esc(f.name)}">下載</a>` : `<span class="small muted">（模擬）示範檔案，冇真內容</span>`}</div>`;
    el.innerHTML = `<button type="button" class="lb-x" data-lbclose aria-label="關閉">×</button>
      ${n > 1 ? `<button type="button" class="lb-nav prev" data-lbgo="-1" aria-label="上一個">‹</button><button type="button" class="lb-nav next" data-lbgo="1" aria-label="下一個">›</button>` : ""}
      <figure class="lb-stage">${media}<figcaption>${esc(f.cap || f.name)}${n > 1 ? ` · ${LB.i + 1} / ${n}` : ""}</figcaption></figure>`;
    el.hidden = false;
    document.body.style.overflow = "hidden";
    el.querySelector(".lb-x").focus();
  }
  function stepLB(k) { if (!LB) return; LB.i = (LB.i + k + LB.files.length) % LB.files.length; drawLB(); }
  function closeLB() {
    const el = $("#lb"); if (!el || !LB) return;

  const VIEWS = NAV.boss.concat(NAV.worker).map(([v]) => v).concat("login");

  const PRIVATE = ["needs", "hired", "sent", "work"];

  function navCount(view) {
    if (!signedUp()) return 0;
    if (view === "needs") return myNeeds().length;
    if (view === "hired") return myOrders("boss").filter(o => o.status < 6).length;

  function renderNav() {
    const role = roleOf(state.view);

    }).join("");
  }
  function go(view, opts) {
    if (!VIEWS.includes(view)) view = "post";
    if (PRIVATE.includes(view) && !signedUp()) { if (state.view !== "login") state.loginFrom = state.view; state.loginNext = view; state.loginWhy = view; state.afterLogin = null; view = "login"; }
    if (roleOf(view) !== roleOf(state.view)) closeDrawer();
    if (view !== state.view) { state.filter = "all"; state.tier = "all"; }

    const old = state.profile;
    state.profile = {
      id: "u:" + me(), raw, name: state.user ? state.user.name : "你", head: cat.name, cat: cat.id, tier, skills, rate: rateFor(tier, cat),
      rating: 4.5, done: 0, avail: old ? old.avail : "now", hue: state.user ? state.user.hue : "#17694F",

  function orderAction(id, act) {
    const o = state.orders.find(x => x.id === id); if (!o) return;
    const lk = o.link && state.orders.find(x => x.id === o.link);
    if (act === "deliver" && o.side === "worker") return openDeliver(o, lk);
    if (act === "revise") return openRevise(o, lk);
    if (act === "deliver") {
      // simulated worker hands in a finished piece
      Object.assign(o, { status: 3, files: [samplePicFile("#0874AB", o.partner + " 嘅成品")], note: "成品交咗，請睇吓，有要改話我知。" });
      toast(`${o.partner} 交咗貨（模擬）`);
      return refresh("hired", "work");
    }
    if (act === "towork") {
      const p = state.profile; if (!p) return toast("先建立工作者檔案");
      p.works = worksOf(p).concat(o.files.map(f => ({ ...f, cap: f.cap || o.title }))).slice(-20);
      o.inWorks = true;
      saveMe();
      toast("已加入作品集，客戶揀人時會見到");
      return refresh("work", "find");
    }
    if (act === "confirm") {
      o.status = 5;
      if (lk) { lk.status = 5; notify(lk.owner, `${state.user.name} 確認完成：${o.title}，可以互相評分`, "work"); }
      else later(1500, () => {
        o.reviews = o.reviews || {};
        o.reviews.theirs = { ...THEIR_REVIEW[o.side] };
        if (o.reviews.mine) finishReviews(o);
        else { toast(`${o.partner} 評咗你，你評完就會公開（模擬）`); notify(me(), `${o.partner} 評咗你：${o.title}`, o.side === "boss" ? "hired" : "work"); refresh("hired", "work"); }
      });
      toast("已確認完成，可以互相評分");
      return refresh("hired", "work");
    }
  }

  function notify(to, text, view) {

        : `<p class="muted">未有通知。有人報價、交貨、要求修改或者評你，會喺度話你知。</p>`}</div>`);

  }

  // worker: add, caption and remove portfolio pieces
  function openWorks() {
    const p = state.profile; if (!p) return;
    const list = worksOf(p).map(w => ({ ...w }));
    openDrawer(`${head("我嘅作品集", "客戶揀人時最先睇呢度")}
      <form class="drawer-body" id="works-form">
        <p class="small muted">上載 3–6 件最似你想接嘅 job，每件寫一句說明（例如「護膚品 15 秒廣告」）。相片會縮細儲存；影片同文件只保留到重新整理（網站模型限制）。</p>
        ${uploader("works-up", list, { label: "加作品", caption: true, limit: 20 })}
      </form>
      <div class="drawer-foot"><button class="btn btn-primary" type="submit" form="works-form">儲存作品集</button></div>`);
    $("#works-form").addEventListener("submit", e => {
      e.preventDefault();
      p.works = list;
      saveMe();
      closeDrawer();
      toast(`作品集已儲存（${list.length} 件）`);
      refresh("find", "work");
    });
  }

  // client-side chat about one need with one worker
  function openChat(need, t, price) {
    const days = Math.max(2, Math.round(need.days * 0.8));
    state.chat = { need, t, quote: price, days };
    openDrawer(`${head("同 " + esc(t.name) + " 傾", esc(need.title))}
      <div class="drawer-body" id="chat-log" aria-live="polite"></div>
      <div class="drawer-foot" id="chat-foot">
        <form class="compose" id="chat-form"><input type="text" id="chat-in" placeholder="打字…" autocomplete="off"><button class="btn btn-ghost btn-sm" type="submit">傳送</button></form>
        <div class="btns">
          <button class="btn btn-primary" type="button" id="chat-agree">落實 ${hk(price)}</button>
          <button class="btn btn-ghost" type="button" id="chat-sum">AI 總結</button>
        </div>
      </div>`);
    pushMsg("sys", "對話有記錄，有爭議時用嚟處理。唔好喺度交換銀行戶口。");
    pushMsg("them", `你好！「${need.title}」我可以 ${days} 日內交，報價 ${hk(price)}，包括${catById(need.cat).deliver.join("、")}。`);
    $("#chat-form").addEventListener("submit", e => {
      e.preventDefault();
      const v = $("#chat-in").value.trim(); if (!v) return;
      pushMsg("me", v); $("#chat-in").value = "";
      const c = state.chat;
      later(800, () => { if (state.chat === c) pushMsg("them", "冇問題，可以加埋，價錢唔變。"); });
    });
    $("#chat-sum").addEventListener("click", () => pushMsg("ai", `AI 總結\njob：${need.title}\n報價：${hk(price)}（預算 ${hk(need.budget)}）\n期限：${days} 日\n未傾清楚：修改次數、版權歸邊個`));
    $("#chat-agree").addEventListener("click", showConfirm);
  }
  function pushMsg(kind, text) {
    if (!state.chat) return;
    const el = document.createElement("div");
    el.className = "msg " + kind + " reveal";
    el.textContent = text;
    $("#chat-log").appendChild(el);
    el.scrollIntoView({ block: "end" });
  }
  // 落實: agree on the amount and swap contacts; the money itself is between the two of them
  function showConfirm() {
    const c = state.chat;
    $("#chat-foot").innerHTML = `
      <div class="sum">
        <div><span class="muted">協定金額</span><span class="num">${hk(c.quote)}</span></div>
        <div><span class="muted">交貨</span><span>${c.days} 日內</span></div>
      </div>
      <p class="small muted">金額同付款方式由你同 ${esc(c.t.name)} 自行傾，平台唔經手、唔收費。落實之後雙方會見到對方 WhatsApp。</p>
      <button class="btn btn-primary" type="button" id="pay-go">落實，交換聯絡</button>`;
    $("#pay-go").addEventListener("click", () => {
      const { need, t, quote } = state.chat;
      need.status = "hired"; need.hiredWith = t.id;
      const o = need.offers.find(x => x.talentId === t.id); if (o) o.status = "accepted";
      const s = need.subs.find(x => x.talentId === t.id); if (s) s.status = "picked";
      // everyone else who replied hears they were not picked
      need.offers.filter(x => x !== o && x.status === "new").forEach(x => {
        x.status = "declined";
        const q = state.quotes.find(y => y.id === x.quoteId);
        if (q) { q.status = "declined"; notify(q.owner, `${need.client} 揀咗其他人：${need.title}`, "sent"); }
      });
      need.subs.filter(x => x !== s && x.status === "new").forEach(x => {
        x.status = "passed";
        const ms = state.subs.find(y => y.id === x.subId);
        if (ms) { ms.status = "declined"; notify(ms.owner, `${need.client} 揀咗其他人：${need.title}`, "sent"); }
      });
      const bo = { id: "o" + Date.now(), owner: me(), side: "boss", title: need.title, partner: t.name, amount: quote, status: 2, rating: 0 };
      state.orders.push(bo);
      if (t.id.startsWith("u:")) {
        const wEmail = t.id.slice(2), w = known[wEmail] ? known[wEmail].user : {};
        const wo = { id: "o" + (Date.now() + 1), owner: wEmail, side: "worker", title: need.title, partner: need.client, amount: quote, status: 2, rating: 0, link: bo.id, contact: state.user.phone };
        bo.link = wo.id; bo.contact = w.phone;
        state.orders.push(wo);
        const q = o && state.quotes.find(x => x.id === o.quoteId); if (q) q.status = "accepted";
        const ms = s && state.subs.find(x => x.id === s.subId); if (ms) ms.status = "picked";
        notify(wEmail, `${need.client} 揀咗你：${need.title}，可以開工`, "work");
      }
      closeDrawer();
      toast(`已落實，${t.name} 可以開工，WhatsApp 已經交換`);
      go("hired");
    });
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) handle(b, { ...b.dataset });
  });
  function handle(b, d) {
    if (d.lb) return openLB(d.lb);
    if (d.lbclose !== undefined) return closeLB();
    if (d.lbgo) return stepLB(+d.lbgo);
    if (d.close !== undefined) return closeDrawer();
    if (d.loginclose !== undefined) return closeLogin();
    if (d.gacc) return signIn(DEMO_ACCOUNTS[+d.gacc]);
    if (d.me !== undefined) return openAccount();
    if (d.notes !== undefined) return openNotes();
    if (d.notego) { closeDrawer(); return go(d.notego); }
    if (d.logout !== undefined) return signOut();
    if (LOGIN_ACTIONS.some(k => d[k] !== undefined) && !signedUp()) {
      return requireLogin(() => handle(b, d), LOGIN_ACTIONS.find(k => d[k] !== undefined));
    }
    if (d.role) { const v = d.role === "boss" ? (signedUp() && myNeeds().some(n => !n.example) ? "needs" : "post") : "find"; return go(v); }
    if (d.go) { closeDrawer(); return go(d.go); }
    if (d.job) return showJob(d.job);
    if (d.talent) return showTalent(d.talent);
    if (d.fill) { const q = document.getElementById(d.fill); q.value = d.text; q.focus(); return; }
    if (d.tier) { state.tier = state.tier === d.tier && b.classList.contains("tier-card") ? "all" : d.tier; return RENDER[state.view]({}); }
    if (d.filter) { state.filter = d.filter; return RENDER[state.view]({}); }
    // 發 job draft
    if (d.dcat) { readDraft(); const dr = state.draft, c = catById(d.dcat); dr.cat = c.id; dr.skills = c.skills.slice(0, 3); dr.trial.brief = TRIAL_EG[c.id]; return renderDraft(false); }
    if (d.dtier) { readDraft(); state.draft.tier = d.dtier; return renderDraft(false); }
    // 我發嘅 job
    if (d.need) { state.selNeed = d.need; state.needTab = "replies"; return RENDER.needs(); }
    if (d.ntab) { state.needTab = d.ntab; return RENDER.needs(); }
    if (d.invite) {
      const n = needById(state.selNeed); invite(n, [d.invite]); closeDrawer();
      toast(`已邀請 ${talentById(d.invite).name}${n.mode === "trial" ? "試工" : "報價"}`); return RENDER.needs();
    }
    if (d.accept || d.offerchat) {
      const n = needById(state.selNeed), o = n.offers.find(x => x.id === (d.accept || d.offerchat)), t = talentById(o.talentId);
      if (d.offerchat) return openChat(n, t, o.price);
      return hireFrom(n, t, o.price, `你接受咗 ${t.name} 嘅報價 ${hk(o.price)}，落實之後交換 WhatsApp 就可以開工。`);
    }
    if (d.pick) {
      const n = needById(state.selNeed), s = n.subs.find(x => x.id === d.pick), t = talentById(s.talentId);
      return hireFrom(n, t, quoteFor(n, t), `你揀咗 ${t.name} 嘅試工樣板，確認報價就可以落實。`);
    }
    if (d.pass) { needById(state.selNeed).subs.find(x => x.id === d.pass).status = "passed"; return RENDER.needs(); }
    // 搵工
    if (d.quote) { if (!needProfile("quote", d.quote)) openQuote(d.quote); return; }
    if (d.trial) { if (!needProfile("trial", d.trial)) openSubmit(d.trial); return; }
    if (d.editprofile) return renderProfile({ edit: true });
    if (d.joinwork !== undefined) return requireLogin(() => { if (!state.profile) startAddWorker(); }, "profile");
    if (d.addworker !== undefined) return startAddWorker();
    if (d.joinhire !== undefined) return requireLogin(() => {}, "publish");
    if (d.works) return openWorks();
    if (d.unphoto !== undefined) { state.user.photo = state.user.gphoto || ""; saveMe(); renderAccount(); RENDER[state.view]({}); toast("用返 Google 頭像"); return openAccount(); }
    if (d.ptier) { const p = state.profile; p.tier = d.ptier; p.rate = rateFor(p.tier, catById(p.cat)); return RENDER.find({}); }
    if (d.avail) { state.profile.avail = d.avail; return RENDER.find({}); }
    // 進行中
    if (d.order && d.act) return orderAction(d.order, d.act);
    if (d.review) return openReview(d.review);
  }
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => {
    if (LB) {
      if (e.key === "Escape") closeLB();
      if (e.key === "ArrowLeft") stepLB(-1);
      if (e.key === "ArrowRight") stepLB(1);
      return;
    }
    if (e.key !== "Escape") return;
    if (!$("#drawer").hidden) closeDrawer();
    else if (state.view === "login") closeLogin();
  });
  $("#logo").addEventListener("click", () => { closeDrawer(); go("post"); });
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== state.view) go(v); });

  // ---------- back end: records and files are kept on the Mac when the page can reach it ----------
  // served from the Mac itself (local test) it talks to the same address; on GitHub Pages it uses the tunnel address
  const BACKEND_URL = "https://rexmb.tail2f3ae7.ts.net";
  const API = (() => {
    const h = location.hostname;
    if (/^https?:$/.test(location.protocol) && (h === "localhost" || h === "127.0.0.1")) return location.origin;
    if (h === "rexvanrs24.github.io") return BACKEND_URL;
    return "";
  })();
  const canUpload = () => !!(API && me());
  // Google login: the server checks Google's token and gives back a session kept in this browser
  const CFG = { google: "", demo: !API };
  let session = null;
  try { session = JSON.parse(localStorage.getItem("aipd-session") || "null"); } catch (e) {}
  const realLogin = () => !!(API && CFG.google);
  const authHeaders = () => session && session.token ? { Authorization: "Bearer " + session.token } : (CFG.demo && me() ? { "X-User": me() } : {});
  const HUES = ["#B4532E", "#3E6FA8", "#2E7D5B", "#8A5A12", "#6A4E8C", "#8A3F5C", "#2E6B7A"];
  const hueFor = email => HUES[[...email].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
  function loadGoogle() {
    if (window.google && google.accounts) return Promise.resolve();
    return new Promise((ok, bad) => {
      const sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client?hl=zh-TW"; sc.async = true; sc.onload = ok; sc.onerror = bad;
      document.head.appendChild(sc);
    });
  }
  async function mountGoogle() {
    const box = $("#g-btn"); if (!box) return;
    try {
      await loadGoogle();
      google.accounts.id.initialize({ client_id: CFG.google, callback: onGoogle, ux_mode: "popup" });
      google.accounts.id.renderButton(box, { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "zh-TW", width: Math.min(360, box.clientWidth || 320) });
    } catch (e) { box.innerHTML = `<p class="err">連唔到 Google 登入，請檢查網絡再重新整理。</p>`; }
  }
  async function onGoogle(resp) {
    try {
      const r = await fetch(API + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
      if (!r.ok) throw new Error("login " + r.status);
      const j = await r.json();
      session = { token: j.token, email: j.email };
      try { localStorage.setItem("aipd-session", JSON.stringify(session)); } catch (e) {}
      // read this account's saved details first, so a returning person skips the setup form
      since = 0;
      try { await pull(); } catch (e) {}
      signIn({ name: j.name, email: j.email, hue: hueFor(j.email), photo: j.picture || "", gphoto: j.picture || "" });
    } catch (e) { toast("Google 登入未成功，請再試一次"); }
  }
  // the server no longer accepts this login (expired or signed out elsewhere)
  function loginExpired() {
    session = null;
    try { localStorage.removeItem("aipd-session"); } catch (e) {}
    if (state.user) { toast("登入已經過期，請再登入"); signOut(true); }
  }
  async function uploadBlob(blob, name) {
    const r = await fetch(API + "/api/files", { method: "POST", body: blob,
      headers: { "Content-Type": blob.type || "application/octet-stream", ...authHeaders(), "X-Filename": encodeURIComponent(name) } });
    if (!r.ok) throw new Error("upload " + r.status);
    return API + (await r.json()).url;
  }
  const SYNCED = { needs: () => state.needs, quotes: () => state.quotes, subs: () => state.subs, orders: () => state.orders, notes: () => state.notes };
  const sent = {};       // "coll:id" -> the record as last saved or received
  let since = 0, online = null, syncing = false;
  // file links are stored with the address they were uploaded to; point them at the current one
  const fixUrls = text => text.replace(/https?:\/\/[^"\\\s]*?\/files\/(?=[0-9a-f]{32}\.)/g, API + "/files/");
  function setOnline(ok) {
    if (online === ok) return;
    if (online !== null) toast(ok ? "已經連返後台" : "連唔到後台，新資料暫時只存喺呢部機");
    online = ok;
  }
  async function push() {
    if (!signedUp()) return;
    const jobs = [];
    for (const [coll, get] of Object.entries(SYNCED)) for (const x of get()) {
      if (x.example || !(x.owner || x.to)) continue;
      const text = JSON.stringify(x), key = coll + ":" + x.id;
      if (sent[key] !== text) jobs.push([coll, x.id, text, key]);
    }
    const mine = JSON.stringify({ id: me(), user: state.user, profile: state.profile });
    if (sent["users:" + me()] !== mine) jobs.push(["users", me(), mine, "users:" + me()]);
    for (const [coll, id, text, key] of jobs) {
      const r = await fetch(`${API}/api/rec/${coll}/${encodeURIComponent(id)}`, { method: "PUT", body: text, headers: { "Content-Type": "application/json", ...authHeaders() } });
      if (r.ok) sent[key] = text;
      else if (r.status === 401 && session) return loginExpired();
    }
  }
  async function pull() {
    const r = await fetch(`${API}/api/state?since=${since}`, { headers: authHeaders(), cache: "no-store" });
    if (r.status === 401 && session) { loginExpired(); return; }
    if (!r.ok) throw new Error("state " + r.status);
    const j = JSON.parse(fixUrls(await r.text()));
    let changed = false;
    for (const { coll, data } of j.recs) {
      const key = coll + ":" + data.id;
      if (coll === "users") {
        const email = String(data.id).toLowerCase();
        if (email === me()) {
          // your own account: take the saved copy unless you changed something here that is not saved yet
          if (sent[key] !== undefined && JSON.stringify({ id: me(), user: state.user, profile: state.profile }) !== sent[key]) continue;
          if (data.user) Object.assign(state.user, data.user);
          if (data.profile) state.profile = state.profile ? Object.assign(state.profile, data.profile) : data.profile;
          sent[key] = JSON.stringify({ id: me(), user: state.user, profile: state.profile });
        }
        const before = JSON.stringify(known[email] || null);
        known[email] = { user: data.user, profile: data.profile };
        if (before !== JSON.stringify(known[email])) changed = true;
        continue;
      }
      const list = SYNCED[coll] && SYNCED[coll](); if (!list) continue;
      const local = list.find(x => x.id === data.id);
      if (local) {
        const now = JSON.stringify(local);
        if (sent[key] !== undefined && now !== sent[key]) continue;   // changed here, not saved yet: keep ours
        if (now !== JSON.stringify(data)) { Object.assign(local, data); changed = true; }
        sent[key] = JSON.stringify(local);
      } else {
        if (coll === "needs") list.unshift(data); else list.push(data);
        sent[key] = JSON.stringify(data);
        changed = true;
      }
    }
    since = j.now;
    if (fillContacts()) changed = true;
    if (changed) {
      saveKnown();
      renderNav(); renderAccount();
      const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
      if ($("#drawer").hidden && !typing && state.view !== "login" && !LB) RENDER[state.view]({});
    }
  }
  // the client's copy of a job gets the worker's WhatsApp once the server lets it through
  function fillContacts() {
    let any = false;
    state.orders.filter(o => ownedBy(o) && o.link && !o.contact).forEach(o => {
      const lk = state.orders.find(x => x.id === o.link), k = lk && known[String(lk.owner || "").toLowerCase()];
      if (k && k.user && k.user.phone) { o.contact = k.user.phone; any = true; }
    });
    return any;
  }
  async function syncNow() {
    if (!API || syncing) return;
    syncing = true;
    try { await push(); await pull(); setOnline(true); }
    catch (e) { setOnline(false); }
    finally { syncing = false; }
  }
  // a different person logged in: start again from everything they are allowed to see
  function resync() {
    since = 0;
    syncNow();
  }
  async function startSync() {
    if (!API) return;
    try {
      const c = await (await fetch(API + "/api/config", { cache: "no-store" })).json();
      CFG.google = c.google_client_id || ""; CFG.demo = !!c.demo;
    } catch (e) {}
    // on the real site a saved login without its server session is not a login
    if (realLogin() && state.user && !session && !CFG.demo) { state.user = null; state.profile = null; renderAccount(); }
    if (state.view === "login") RENDER.login({});
    syncNow();
    setInterval(syncNow, 3000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  }

  // ---------- 說明 under the bar: change the text (and its date) and it shows again for everyone ----------
  // notes under the bar, top to bottom; each one stays closed once its × is pressed, until its id changes
  const MEMOS = [
    { id: "info-2026-11-03", tag: "說明", text: "AI拍檔試用緊：用 Google 登入，就可以發 job、報價同上載作品。平台只做配對，金額同付款方式由雙方自己傾。有問題或者建議，歡迎話我哋知。" },
    { id: "need-2026-11-04c", tag: "而家最需要", kind: "need", text: "AI 搵客：用 AI 喺網上搵出有興趣嘅客，再引佢哋去 WhatsApp 或者落單頁成交，用最少錢搵最多客。識做嘅人，而家最多老闆搵。",
      go: { label: "睇搵客 job", view: "find", filter: "leads" } },
  ];
  function closedMemos() {
    try { return JSON.parse(localStorage.getItem("aipd-memos-closed") || "[]"); } catch (e) { return []; }
  }
  function showMemo() {
    const closed = closedMemos();
    $("#memos").innerHTML = MEMOS.filter(m => m.text && !closed.includes(m.id)).map(m => `
      <aside class="memo ${m.kind || ""}" aria-label="${esc(m.tag)}">
        <div class="wrap memo-in">
          <span class="memo-tag">${esc(m.tag)}</span>
          <p>${esc(m.text)}</p>
          ${m.go ? `<button type="button" class="memo-go" data-memogo="${m.id}">${esc(m.go.label)}</button>` : ""}
          <button type="button" class="memo-x" data-memox="${m.id}" aria-label="關閉${esc(m.tag)}，之後唔再顯示">×</button>
        </div>
      </aside>`).join("");
  }
  $("#memos").addEventListener("click", e => {
    const x = e.target.closest("[data-memox]"), g = e.target.closest("[data-memogo]");
    if (x) {
      const list = closedMemos().concat(x.dataset.memox);
      try { localStorage.setItem("aipd-memos-closed", JSON.stringify(list)); } catch (err) {}
      x.closest(".memo").remove();
    }
    if (g) {
      const m = MEMOS.find(y => y.id === g.dataset.memogo);
      closeDrawer(); go(m.go.view); state.filter = m.go.filter; RENDER[state.view]({});
    }
  });


  // ---------- examples so each page has something to show ----------
  (function seed() {
    TALENT.forEach((t, i) => { t.works = WORK_CAPS[t.cat].map((cap, k) => ({ ...demoFile(cap, k % 2 ? CAT_HUE[t.cat] : t.hue, i * 7 + k) })); });
    JOBS.forEach((j, i) => {
      j.refs = REF_EG[j.cat].map((n, k) => demoFile(n, CAT_HUE[j.cat], i * 5 + k));
      if (j.trial) j.trial.files = (j.trial.refs || []).map((n, k) => demoFile(n, CAT_HUE[j.cat], i * 3 + k + 50));
    });
  })();

  try { const u = JSON.parse(localStorage.getItem("aipd-user") || "null"); if (u && u.name) { state.user = u; if (known[u.email]) { state.profile = known[u.email].profile; if (state.profile) state.profile.id = "u:" + u.email; } } } catch (e) {}
  renderAccount();
  go(location.hash.slice(1) || "post");
  showMemo();
  startSync();
})();
</script>
