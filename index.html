<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI拍檔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<style>
/* Layout: Uber-style look — black bar, white page, flat grey tiles instead of shadowed cards; each side keeps its own colour (搵人 coral, 搵工 cerulean) on the bar, buttons, selections and progress so you always know which side you are on */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --tile: #F3F3F3;
  --tile-2: #E8E8E8;
  --ink: #000000;
  --muted: #5E5E5E;
  --line: #E2E2E2;
  --shadow: none;
  --accent: #000000;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3F3F3;
  --signal: #8A5A00;
  --signal-soft: #FFF3D6;
  --star: #000000;
  --boss: #D7424E; --boss-ink: #FFFFFF; --boss-soft: #FCE7E9; --boss-top: #FF7B86;
  --worker: #0874AB; --worker-ink: #FFFFFF; --worker-soft: #E1F0F8; --worker-top: #5CB8EA;
  --top-bg: #000000; --top-ink: #FFFFFF; --top-muted: #CBCBCB; --top-line: #333333; --top-tile: #1F1F1F;
  --danger: #D1302A;
  --need: #0F766E; --need-ink: #FFFFFF; --need-soft: #E3F4F1;
  --f-body: "Noto Sans HK", "Figtree", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --f-display: "Figtree", "Noto Sans HK", "PingFang HK", system-ui, sans-serif;
  --f-num: "Figtree", "Noto Sans HK", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #000000; --tile: #1F1F1F; --tile-2: #2B2B2B; --ink: #FFFFFF; --muted: #AFAFAF; --line: #2E2E2E;
    --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #1F1F1F;
    --signal: #F0BC52; --signal-soft: #2D2513; --star: #FFFFFF;
    --boss: #FF7B86; --boss-ink: #2A070B; --boss-soft: #3A1A20;
    --worker: #5CB8EA; --worker-ink: #04192A; --worker-soft: #12293A;
    --top-bg: #000000; --top-line: #333333; --top-tile: #1F1F1F; --danger: #FF7A6E;
  --need: #5EC2B0; --need-ink: #04201C; --need-soft: #0E2A27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #000000; --tile: #1F1F1F; --tile-2: #2B2B2B; --ink: #FFFFFF; --muted: #AFAFAF; --line: #2E2E2E;
  --accent: #FFFFFF; --accent-ink: #000000; --accent-soft: #1F1F1F;
  --signal: #F0BC52; --signal-soft: #2D2513; --star: #FFFFFF;
  --boss: #FF7B86; --boss-ink: #2A070B; --boss-soft: #3A1A20;
  --worker: #5CB8EA; --worker-ink: #04192A; --worker-soft: #12293A;
  --top-bg: #000000; --top-line: #333333; --top-tile: #1F1F1F; --danger: #FF7A6E;
  --need: #5EC2B0; --need-ink: #04201C; --need-soft: #0E2A27;
  color-scheme: dark;
}
body[data-side="boss"] { --accent: var(--boss); --accent-ink: var(--boss-ink); --accent-soft: var(--boss-soft); --side: var(--boss-top); }
body[data-side="worker"] { --accent: var(--worker); --accent-ink: var(--worker-ink); --accent-soft: var(--worker-soft); --side: var(--worker-top); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--top-bg); }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 900; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--top-bg); color: var(--top-ink); box-shadow: inset 0 -3px 0 var(--accent), 0 4px 16px -8px rgba(20, 33, 61, .4); }
.top :focus-visible { outline-color: var(--top-ink); }
.top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px 20px; padding-block: 10px; }
.top .logo { justify-self: start; }
.top .role { justify-self: center; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 10px; }
.gbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.gbtn:hover { border-color: var(--muted); }
.gbtn svg { width: 18px; height: 18px; flex: none; }
.g-btn { min-height: 44px; display: flex; justify-content: center; }
.gbtn.big { width: 100%; justify-content: center; padding: 11px 16px; font-size: 16px; border-radius: 10px; }
.me-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--top-line); background: transparent; color: var(--top-ink); border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.me-btn .avatar { width: 30px; height: 30px; font-size: 14px; }
#account { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--top-line); background: transparent; color: var(--top-ink); cursor: pointer; }
.bell .count { position: absolute; top: -4px; right: -6px; background: var(--accent); color: var(--accent-ink); }
.note-item { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; }
.note-item.unread { background: var(--accent-soft); font-weight: 700; }
.acc-list { display: grid; gap: 8px; }
.acc { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.acc:hover { border-color: var(--accent); }
.acc .avatar { width: 36px; height: 36px; }
.rating-sec { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.rating-sum { display: flex; align-items: center; gap: 12px; }
.rating-sum > b { font-size: 34px; line-height: 1; }
.rating-sum .stars-text { font-size: 18px; }
.review-list { display: grid; gap: 8px; }
.login-page { min-height: calc(100vh - 200px); min-height: calc(100dvh - 200px); display: grid; place-items: center; padding-block: 32px; }
.login-wrap { position: relative; display: grid; width: min(100%, 440px); }
.login-wrap.wide { width: min(100%, 720px); }
.login-x { position: absolute; top: 10px; right: 10px; z-index: 1; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; }
.login-x:hover { background: var(--bg); color: var(--ink); }
.login-page { cursor: default; }
.login-card { width: 100%; display: grid; gap: 16px; padding: 28px 24px; }
.login-card h1 { font-size: 26px; }
.login-card .link { justify-self: center; }
.setup-card .group { gap: 8px; }
.field-title { font-weight: 700; font-size: 15px; }
.req { color: var(--danger); margin-left: 2px; }
.err { color: var(--danger); font-size: 13px; }
.setup-card .tier-card .small { color: var(--muted); }
.setup-card .tier-card .tier { justify-self: start; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.role { display: inline-flex; gap: 8px; }
.role button { border: 2px solid var(--c); background: transparent; color: var(--c); padding: 7px 22px; border-radius: 999px; cursor: pointer; font-size: 17px; font-weight: 900; white-space: nowrap; transition: background .15s ease, color .15s ease; }
.role button[data-role="boss"] { --c: var(--boss-top); }
.role button[data-role="worker"] { --c: var(--worker-top); }
.role button:hover { background: color-mix(in srgb, var(--c) 16%, transparent); }
.role button[aria-pressed="true"] { background: var(--c); color: var(--top-bg); box-shadow: 0 6px 18px -6px var(--c); }

.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--signal-soft); color: var(--signal); font-size: 12px; font-family: var(--f-num); }
@media (max-width: 900px) {
  .top-right { display: contents; }
  .top #account { grid-column: 3; grid-row: 1; justify-self: end; }
  .top .nav { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
}
@media (max-width: 560px) { .me-btn .long { display: none; } .me-btn { padding: 3px; } }
@media (max-width: 420px) { .role button { padding: 6px 14px; font-size: 15.5px; } }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 19px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--top-ink); }
.logo-mark { width: 28px; height: 20px; position: relative; flex: none; }
.logo-mark::before, .logo-mark::after { content: ""; position: absolute; top: 0; width: 20px; height: 20px; border-radius: 50%; }
.logo-mark::before { left: 0; background: var(--boss-top); }
.logo-mark::after { right: 0; background: var(--worker-top); opacity: .9; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 7px 14px; font-weight: 500; border-radius: 999px; cursor: pointer; color: var(--top-muted); white-space: nowrap; }
.nav button:hover { color: var(--top-ink); }
.nav button[aria-current="page"] { color: var(--top-ink); background: rgba(255, 255, 255, .14); }
.nav .count { background: rgba(255, 255, 255, .14); color: var(--top-ink); }
.nav button[aria-current="page"] .count { background: var(--accent); color: var(--accent-ink); }
body[data-side="boss"] .nav button[aria-current="page"] .count { background: var(--boss-top); color: var(--top-bg); }
body[data-side="worker"] .nav button[aria-current="page"] .count { background: var(--worker-top); color: var(--top-bg); }
@media (max-width: 420px) { .logo-text { display: none; } .nav button { padding: 7px 10px; } }

main { padding-block: 28px 64px; display: grid; gap: 28px; }
.view { display: grid; gap: 24px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; font-weight: 700; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary { box-shadow: 0 4px 12px -6px var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
textarea, input[type="text"], input[type="number"], input[type="tel"], select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
textarea { resize: vertical; min-height: 76px; }
textarea:focus, input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ask-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* wide screens: action column on the left stays put, the list fills the rest */
.split { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }
.split > .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 16px; min-width: 0; }
.split > .main { display: grid; gap: 12px; min-width: 0; }
/* the job form and the worker profile are taller than a screen: let them scroll with the page instead of sticking */
#v-post .split > .side, #v-find .split > .side { position: static; }
.form-head { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: default; }
.form-head .h-side { margin: 0; }
.form-head .form-hint, .form-head .chev { display: none; }
@media (max-width: 980px) {
  .form-head { cursor: pointer; }
  .form-head .chev { display: inline-block; margin-left: auto; font-size: 22px; line-height: 1; transition: transform .2s ease; }
  #draft-form:not(.folded) .form-head .chev { transform: rotate(180deg); }
  /* folded: the heading and the box to write in stay; the rest opens once you write or tap the heading */
  #draft-form.folded > :not(.form-head):not(.step):not([for="d-desc"]):not(#d-desc) { display: none !important; }
  #draft-form.folded > .step ~ .step { display: none !important; }
  #draft-form.folded #d-desc { min-height: 0; }
  #draft-form.folded { cursor: pointer; }
  .prof.folded { cursor: pointer; }
}
/* the job form stands out in the side colour: a coloured frame, a tinted top and the heading in that colour */
#draft-form { border: 2px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 220px); box-shadow: 0 10px 28px -14px var(--accent); }
#draft-form .form-head .h-side { color: var(--accent); }
#draft-form #d-desc { background: var(--surface); border: 1px solid var(--line); }
/* your worker profile on 搵工 stands out the same way, in the worker colour */
#find-side .prof { border: 2px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 220px); box-shadow: 0 10px 28px -14px var(--accent); }
#find-side .prof > .ask-row h3 { color: var(--accent); font-size: 24px; font-weight: 800; }
/* the name next to the logo stays on one line, and gives way on a narrow phone */
.logo-text { white-space: nowrap; }
@media (max-width: 480px) { .logo-text { display: none; } }
@media (max-width: 980px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .side { position: static; }
}
.side .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.side .fields:not(.pair) label:first-child { grid-column: 1 / -1; }
.fields.pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.h-side { font-size: clamp(24px, 3vw, 30px); }
.field-label { font-size: 13px; color: var(--muted); }
.tabs .chip { font-size: 14px; padding: 5px 14px; }
.pill { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.waiting { color: var(--signal); }
.pill.accepted { color: var(--accent); }
.pill.declined { color: var(--muted); }
.person { display: flex; gap: 12px; align-items: center; min-width: 0; }
.hard { margin: 4px 0 0; padding-left: 1.2em; font-size: 14px; }
.hard li::marker { color: var(--signal); }
.tier { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; vertical-align: 2px; white-space: nowrap; }
.tier.master { background: var(--signal-soft); color: var(--signal); }
.tier.mid { background: var(--accent-soft); color: var(--accent); }
.tier.backup { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tier-card { display: grid; gap: 6px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; cursor: pointer; }
.tier-card:hover { border-color: var(--accent); }
@media (max-width: 700px) { .tiers { grid-template-columns: minmax(0, 1fr); } }
.modes { display: grid; gap: 8px; }
.modes label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.modes label > span { display: grid; gap: 2px; }
.modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.modes input { margin-top: 4px; accent-color: var(--accent); }
.trial-tag { color: var(--signal); font-weight: 700; }
.trial-box { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 6px; }
.subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.sub { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: grid; align-content: start; min-width: 0; }
.sub.passed { opacity: .5; }
.sub-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; background: var(--bg); }
.sub-media:empty { display: none; }
.sub-media img, .sub-media video { display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.sub-media audio { width: 100%; padding: 8px; }
.file-name { padding: 12px; font-size: 13px; overflow-wrap: anywhere; }
.sub-body { padding: 12px 14px; display: grid; gap: 8px; }
.drop { display: grid; gap: 4px; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop input { font-size: 13px; max-width: 100%; }
.snip { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.row-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
@media (max-width: 700px) { .row-tags { display: none; } }

.step { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.step > span:first-child { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-family: var(--f-num); }
.group { display: grid; gap: 6px; }
.fields.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.side .fields.trio label:first-child { grid-column: auto; }
.tier-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button.row { width: 100%; background: var(--surface); border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.row:first-child { border-top: 0; }
.need-item[aria-current="true"] { background: var(--accent-soft); }
.need-item:hover h3 { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.reviews { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.review { display: grid; gap: 4px; align-content: start; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.stars-text { color: var(--star); letter-spacing: 2px; }
.stars-text .off { color: var(--line); }
.stars.big button { font-size: 32px; }
.stats b { font-size: 24px; }
@media (max-width: 560px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.empty { justify-items: start; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tag-direct { color: var(--accent); font-weight: 700; }

/* rows */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.row-main { display: flex; gap: 12px; align-items: center; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.row-main > div { min-width: 0; }
.row-main:hover h3 { color: var(--accent); }
.row-side { display: flex; align-items: center; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; color: var(--muted); }
.price { font-family: var(--f-num); font-weight: 700; white-space: nowrap; }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row-side { justify-content: space-between; }
}
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.big { width: 72px; height: 72px; font-size: 28px; }

/* ================= design v2 (2026-11-05): lively lists, the 搵人 side mirrors the 搵工 side ================= */

.v2-row2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

.v2-list { display: grid; gap: 12px; }

.v2row:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.v2-pic { position: relative; height: 112px; border-radius: 14px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: var(--tile); display: block; width: 100%; }
.v2-pic > img { width: 100%; height: 100%; object-fit: cover; display: block; }

.v2-act { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

.v2-tip { border: 2px dashed var(--line); border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* card view */
.v2-list.cards { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

.v2-pring { width: 60px; height: 60px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--tile-2) 0); display: grid; place-items: center; flex: none; }

.v2-todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

    const found = [];

        if (!files.length) return;

      rating: (a, b) => b.t.rating - a.t.rating, done: (a, b) => b.t.done - a.t.done, cheap: (a, b) => a.t.rate[0] - b.t.rate[0],
    };
    const sort = state.sort === "match" && !d ? "rating" : state.sort;
    list.sort(by[sort] || by.rating);
    const now = list.filter(x => x.t.avail === "now").length, rs = list.map(x => x.t.rate[0]);
    const avg = list.length ? list.reduce((a, x) => a + x.t.rating, 0) / list.length : 0;
    return `
      <div class="v2-head"><div><h2>${d ? `有 <em>${list.length}</em> 位人才啱你嘅需求` : `平台上有 <em>${list.length}</em> 位人才`}</h2>
        <div class="v2-stats">${now ? `<span class="v2-stat new">${now} 位即時可接</span>` : ""}${list.length ? `<span class="v2-stat">平均 ★ ${avg.toFixed(1)}</span><span class="v2-stat">${hk(Math.min(...rs))} 起</span>` : ""}</div></div>${looks()}</div>
      <div class="v2-bar">${catBar(TALENT)}<div class="v2-row2">${tierSeg()}${sortBar((d ? [["match", "最啱你"]] : []).concat([["rating", "評分最高"], ["done", "做得最多"], ["cheap", "價錢最平"]]))}</div></div>
      <div class="${listCls()}">${list.map(({ t, m }, k) => talentRow(t, m, null, k === 0 && sort === "match" && m && m.total >= 80)).join("") || (TALENT.length ? `<p class="muted">呢個組合暫時未有人才。</p>` : `<div class="box empty"><h3>暫時未有工作者登記</h3><p class="muted">你都可以照樣發 job，工作者喺「搵工」見到就可以報價或者交試工。</p></div>`)}</div>
      <div class="v2-tip"><div><b>${d ? "睇中邊個？" : "唔知揀邊個？"}</b><p class="muted">${d ? "發佈 job 之後，配對分最高嘅 3 個人會收到通知；所有工作者都可以喺「搵工」見到你嘅 job。" : "喺左邊講一句需求，AI 會幫你按配對分排好啲人。"}</p></div></div>`;
  }
  // one person: three pieces of work with the face on top, the facts, and what you can do
  function talentRow(t, m, action, best) {
    const pics = worksOf(t).filter(isImg).slice(0, 3);
    const works = pics.length ? `<span class="v2-works${pics.length === 1 ? " one" : ""}">${pics.map(f => `<img src="${f.url}" alt="" loading="lazy">`).join("")}</span>`
      : `<span class="tile" style="background:${t.hue}">${esc(CAT_SHORT[t.cat] || "")}</span>`;
    return `<article class="v2row${best ? " best" : ""}">
      ${best ? `<span class="v2-flag">最啱你嘅需求</span>` : ""}
      <button type="button" class="v2-pic" data-talent="${t.id}" aria-label="睇 ${esc(t.name)} 嘅作品">${works}${avatar(t)}${t.avail === "now" ? `<span class="dot" title="即時可接"></span>` : ""}</button>
      <div class="v2-body">
        <div class="v2-t"><button type="button" data-talent="${t.id}"><h3>${esc(t.name)}</h3></button>${tierBadge(t.tier)}<span class="v2-pill">${AVAIL[t.avail]}</span></div>
        <div class="v2-meta">${t.done ? `<span class="star">★ ${t.rating.toFixed(1)}</span><span>完成 ${t.done} 單</span>` : `<span>新人，未有評價</span>`}<span>${esc(t.head)}</span></div>
        <p class="v2-desc">${esc(t.bio)}</p>
        <div class="v2-skills">${t.skills.slice(0, 4).map(x => `<span>${esc(x)}</span>`).join("")}</div>
      </div>
      <div class="v2-side">
        ${m ? ring(m.total) : ""}
        <div class="v2-bud"><b>${hk(t.rate[0])}</b><small>起 · 最高 ${hk(t.rate[1])}</small></div>
        <div class="v2-act">${action === undefined || action === null ? `<button type="button" class="btn btn-primary" data-talent="${t.id}">睇作品</button>` : action}</div>
        ${m ? `<div class="v2-why">${esc(m.why)}</div>` : ""}

  }

  async function runDraft() {
    const raw = $("#ask-q").value.trim();
    if (!raw) { toast("請先講一句你想搵人做咩"); $("#ask-q").focus(); return; }
    $("#draft").innerHTML = `<div class="box thinking">AI 睇緊你嘅需求…</div>`;
    await wait(800);
    const cat = detectCat(raw), budget = parseBudget(raw), days = parseDays(raw);
    const tier = suggestJobTier(raw, cat, budget || cat.median);
    state.draft = {
      raw, title: titleFrom(raw, cat), cat: cat.id, tier, suggested: tier,
      skills: [...new Set(skillsIn(raw).concat(cat.skills.slice(0, 3)))].slice(0, 4),
      budget: budget || cat.median, budgetGuess: !budget, days: days || 14, daysGuess: !days,
      mode: state.draft ? state.draft.mode : "direct", refs: state.draft ? state.draft.refs : [],
      trial: { brief: TRIAL_EG[cat.id], max: 5, days: 3, files: state.draft ? state.draft.trial.files : [] },
    };
    RENDER.post();
    renderDraft(true);
  }

  // keep what was typed before re-drawing the draft
  function readDraft() {
    const d = state.draft; if (!d || !$("#d-title")) return;
    d.raw = $("#d-desc").value;
    d.title = $("#d-title").value.trim();
    if (d.title || d.raw.trim()) d.touched = true;
    if ($("#d-budget").value) { d.budget = Math.max(100, parseInt($("#d-budget").value, 10) || d.budget); d.budgetGuess = false; }
    if ($("#d-days").value) { d.days = Math.max(1, parseInt($("#d-days").value, 10) || d.days); d.daysGuess = false; }
    if ($("#d-handle")) d.handle = $("#d-handle").value.trim();
    if ($("#t-brief")) {
      d.trial.brief = $("#t-brief").value.trim() || d.trial.brief;
      d.trial.max = Math.max(1, parseInt($("#t-max").value, 10) || d.trial.max);
      d.trial.days = Math.max(1, parseInt($("#t-days").value, 10) || d.trial.days);
    }
  }

  function renderDraft(fresh) {
    const d = state.draft, cat = catById(d.cat);
    // your sign-up number can arrive after the form was first drawn; fill it in until the form has been read once
    if (d.handle == null && (d.via || "wa") === "wa" && state.user && state.user.phone) d.handle = state.user.phone;
    const guess = [d.budgetGuess && "預算", d.daysGuess && "期限"].filter(Boolean);
    refreshTalent();
    const top = ranked(d, TALENT.filter(t => t.avail !== "off")).slice(0, 3).map(x => x.t.name);
    $("#draft").innerHTML = `
      <form class="box ${fresh ? "reveal" : ""}${state.formOpen ? "" : " folded"}" id="draft-form">
        <button type="button" class="form-head" data-formtoggle aria-expanded="${!!state.formOpen}"><span class="h-side">你嘅需求</span><span class="chev" aria-hidden="true">⌄</span></button>
        <div class="step"><span>1</span>講你要做咩</div>
        <label class="field-label" for="d-desc">詳細講吓要做咩</label>
        <textarea id="d-desc" rows="4" placeholder="例如：${esc(HIRE_EG[0])}">${esc(d.raw)}</textarea>
        <div class="chips">${HIRE_EG.map(e => `<button type="button" class="chip" data-fill="d-desc" data-text="${esc(e)}">${esc(e.slice(0, 12))}…</button>`).join("")}</div>
        <button type="button" class="btn btn-ghost btn-sm" data-autofill style="justify-self:start">AI 幫我填下面</button>
        <div class="fields">
          <label>job 名<input type="text" id="d-title" value="${esc(d.title)}" placeholder="例如：60 秒產品宣傳片"></label>
          <label>預算（HK$）<input type="number" id="d-budget" min="100" step="100" value="${d.budget}"></label>
          <label>幾多日內交<input type="number" id="d-days" min="1" value="${d.days}"></label>
        </div>
        ${guess.length ? `<div class="note">${guess.join("同")}係按${cat.name}市價先填，可以改。</div>` : ""}
        <div class="group"><span class="small muted">類別</span>${chipRow("類別", "dcat", CATS.map(c => [c.id, c.name]), d.cat)}</div>
        <div class="group"><span class="small muted">搵邊類人（AI 建議：${TIERS[d.suggested].name}）</span>${chipRow("級別", "dtier", Object.entries(TIERS).map(([k, v]) => [k, v.name]), d.tier)}
          <span class="small muted">${TIERS[d.tier].desc}，一般 ${TIERS[d.tier].price}</span></div>
        <div><b class="small">呢類 job 花時間喺邊</b><ul class="hard">${cat.hard.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>
        ${uploader("d-refs", d.refs, { label: "參考檔案（可選）", hint: "產品相、舊片、logo、規格表、想要嘅風格例子。工作者報價前會睇到，可以拖入嚟。", limit: 12 })}

        <div class="step"><span>2</span>點樣揀人</div>
        <div class="modes" role="radiogroup" aria-label="點樣揀人">${Object.entries(MODES).map(([k, v]) => `
          <label><input type="radio" name="d-mode" value="${k}" ${d.mode === k ? "checked" : ""}><span><b>${v.name}</b><span class="small muted">${v.desc}</span></span></label>`).join("")}
        </div>
        ${d.mode === "trial" ? `
          <label class="field-label" for="t-brief">試工內容</label>
          <textarea id="t-brief" rows="3">${esc(d.trial.brief)}</textarea>
          <div class="fields pair">
            <label>最多收幾份<input type="number" id="t-max" min="1" max="20" value="${d.trial.max}"></label>
            <label>幾多日交<input type="number" id="t-days" min="1" value="${d.trial.days}"></label>
          </div>
          ${uploader("t-files", d.trial.files, { label: "試工素材", hint: "試工要用嘅相、片或者檔案，例如「用我提供嘅產品相」就喺度上載。", limit: 10 })}
          <p class="small muted">試工內容要細，工作者大約一兩個鐘做到。試工作品版權屬工作者，揀中落實先轉畀你。</p>`
        : `<p class="small muted">${top.length ? `發佈後會通知配對分最高嘅 ${top.length} 個人：${top.map(esc).join("、")}；其他工作者都可以喺「搵工」見到。` : "發佈後所有工作者都可以喺「搵工」見到你嘅 job。"}</p>`}

        <div class="step"><span>3</span>落實之後點聯絡你</div>
        <div class="vias" role="radiogroup" aria-label="聯絡方法">${Object.entries(VIAS).map(([k, v]) => `
          <label><input type="radio" name="d-via" value="${k}" ${(d.via || "wa") === k ? "checked" : ""}><span class="vi ${k}">${ico(k)}</span>${v.name}</label>`).join("")}</div>
        <label class="group"><span class="field-title">你嘅 ${viaOf(d.via).ask}</span>
          <input type="${d.via === "wa" ? "tel" : "text"}" id="d-handle" value="${esc(d.handle || "")}" placeholder="${esc(viaOf(d.via).hint)}" inputmode="${viaOf(d.via).mode}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
          <span class="small muted">會存入你嘅個人資料。報價嘅人都要有 ${viaOf(d.via).name} 帳戶；你揀中邊個，雙方先會收到對方嘅帳戶。</span></label>
        <button class="btn btn-primary" type="submit">發佈 job</button>
      </form>`;
    document.querySelectorAll('input[name="d-mode"]').forEach(r => r.addEventListener("change", () => { readDraft(); d.mode = r.value; renderDraft(false); }));
    // a new app: keep what was typed only if it still fits; a WhatsApp number comes back from sign-up
    document.querySelectorAll('input[name="d-via"]').forEach(r => r.addEventListener("change", () => {
      readDraft(); const from = viaOf(d.via); d.via = r.value; const to = viaOf(d.via);
      if (from !== to) d.handle = myHandle(d.via);
      renderDraft(false); const h = $("#d-handle"); if (h) { h.focus(); h.setSelectionRange(h.value.length, h.value.length); }
    }));
    $("#draft-form").addEventListener("submit", e => {
      e.preventDefault(); readDraft();
      if (!d.raw.trim()) { toast("請寫低你要做咩"); $("#d-desc").focus(); return; }
      if (!d.title) { toast("請填 job 名"); $("#d-title").focus(); return; }
      const v = viaOf(d.via); d.via = VIAS[d.via] ? d.via : "wa"; d.handle = v.clean(d.handle);
      if (!d.handle) { toast(`請填你嘅 ${v.ask}`); $("#d-handle").focus(); return; }
      if (!v.ok(d.handle)) { toast(v.bad); $("#d-handle").focus(); return; }
      if (signedUp() && myHandle(d.via) !== d.handle) setMyHandle(d.via, d.handle);
      d.skills = [...new Set(skillsIn(d.raw + " " + d.title).concat(catById(d.cat).skills.slice(0, 3)))].slice(0, 4);
      requireLogin(publishNeed, "publish");
    });
    const main = $("#v-post .main"); if (main) main.innerHTML = talentList();
    // starting to write, or a tap anywhere on the folded form, opens the rest of it (the heading toggles by itself)
    $("#d-desc").addEventListener("focus", () => { if (!state.formOpen) foldForm(true); });
    $("#draft-form").addEventListener("click", e => { if (!state.formOpen && !e.target.closest(".form-head")) foldForm(true); });
    bindUploaders();
  }

  function publishNeed() {
    const d = state.draft, cat = catById(d.cat);
    const need = {
      id: "n" + Date.now(), title: d.title, cat: d.cat, tier: d.tier, skills: d.skills, budget: d.budget, days: d.days,
      desc: d.raw, hard: cat.hard, mode: d.mode, trial: d.mode === "trial" ? { ...d.trial } : null, refs: d.refs,
      contactVia: d.via, contact: d.handle,
      posted: "啱啱", status: "open", invited: [], offers: [], subs: [],
      owner: me(), client: state.user.company || state.user.name,
    };
    state.needs.unshift(need);
    state.draft = null;
    state.selNeed = need.id;
    state.needTab = "replies";
    refreshTalent();
    const ids = ranked(need, TALENT.filter(t => t.avail !== "off")).slice(0, 3).map(x => x.t.id);
    invite(need, ids);
    toast(ids.length ? `job 發佈咗，已經通知 ${ids.length} 個最啱嘅人` : "job 發佈咗，工作者喺「搵工」會見到");
    go("needs");
  }

  // invite workers: each gets a notice in their bell and answers with a real quote or sample from 搵工
  function invite(need, ids) {
    ids.forEach(id => {
      if (need.invited.includes(id) || !String(id).startsWith("u:")) return;
      need.invited.push(id);
      notify(id.slice(2), `${who(need.client)} 邀請你${need.mode === "trial" ? "交試工" : "報價"}：${need.title}`, "find");
    });
    refresh("needs");
  }

  // =================== 老闆：我發嘅 job ===================
  function needStatus(n) {
    if (n.status === "hired") return ["已請人", "accepted"];
    if (n.mode === "trial") return [n.subs.length ? `收到 ${n.subs.length} 份樣板` : "等緊樣板", "waiting"];
    return [n.offers.length ? `收到 ${n.offers.length} 個報價` : "等緊報價", "waiting"];
  }

  RENDER.needs = function () {
    const needs = myNeeds();
    if (!needs.length) {
      $("#v-needs").innerHTML = `<div class="box empty"><h2>你未發過 job</h2><p class="muted">講一句需求，AI 幫你整理同搵人。</p><div><button class="btn btn-primary" type="button" data-go="post">搵人幫手</button></div></div>`;
      return;
    }
    const n = needs.find(x => x.id === state.selNeed) || needs[0];
    state.selNeed = n.id;
    const replies = n.mode === "trial" ? n.subs.length : n.offers.length;
    $("#v-needs").innerHTML = `
      <div class="split">
        <div class="side">
          <div class="ask-row"><h2>我發嘅 job</h2><button class="btn btn-ghost btn-sm" type="button" data-go="post">發新 job</button></div>
          <div class="rows">${needs.map(x => { const [s, c] = needStatus(x); return `
            <button type="button" class="row need-item" data-need="${x.id}" aria-current="${x.id === n.id}">
              <div style="min-width:0"><h3>${esc(x.title)}</h3><div class="meta"><span>${MODES[x.mode].name}</span><span class="num">${hk(x.budget)}</span></div></div>
              <span class="pill ${c}">${s}</span></button>`; }).join("")}</div>
        </div>
        <div class="main">
          ${needKpis(needs)}
          <div class="box">
            <div class="ask-row"><h2>${esc(n.title)} ${tierBadge(n.tier)}</h2><span class="pill ${needStatus(n)[1]}">${needStatus(n)[0]}</span></div>
            ${needTrack(n)}
            <div class="meta"><span>預算 <span class="num">${hk(n.budget)}</span></span><span>${n.days} 日內交</span><span>${catById(n.cat).name}</span><span>${MODES[n.mode].name}</span><span>${n.posted}發佈</span>${n.contactVia ? `<span>聯絡：${viaTag(n.contactVia)} ${esc(viaOf(n.contactVia).show(n.contact || ""))}</span>` : ""}</div>
            <p class="small">${esc(n.desc)}</p>
            ${filesSec("你上載嘅參考檔案", n.refs)}
            ${n.trial ? `<div class="note"><b>試工任務</b>（最多 ${n.trial.max} 份 · ${n.trial.days} 日內）<br>${esc(n.trial.brief)}${filesSec("試工素材", n.trial.files)}</div>` : ""}
            ${n.status === "hired" ? `<div class="note">已經請咗 ${esc(talentById(n.hiredWith).name)}，去「進行中」跟進交貨。 <button class="link" type="button" data-go="hired">去進行中</button></div>` : ""}
          </div>
          ${tabs("ntab", [["replies", (n.mode === "trial" ? "試工樣板" : "收到嘅報價") + (replies ? "（" + replies + "）" : "")], ["more", "邀請更多人"]], state.needTab)}
          ${state.needTab === "more" ? moreHtml(n) : n.mode === "trial" ? subsHtml(n) : offersHtml(n)}
        </div>
      </div>`;
  };

  // where a need stands: 發出 job → 收報價 / 收樣板 → 揀人 → 開工
  function needTrack(n) {
    const got = n.mode === "trial" ? n.subs.length : n.offers.length;
    const at = n.status === "hired" ? 4 : got ? 2 : 1;
    return `<div class="v2-track">${["發出 job", n.mode === "trial" ? "收樣板" : "收報價", "揀人", "開工"].map((x, i) => `<span class="${i < at ? "on" : i === at ? "now" : ""}">${x}</span>`).join("")}</div>`;
  }
  function needKpis(needs) {
    const real = needs.filter(n => !n.example);
    const open = real.filter(n => n.status === "open").length, hired = real.filter(n => n.status === "hired").length;
    const replies = real.reduce((a, n) => a + n.offers.filter(o => o.status === "new").length + n.subs.filter(x => x.status === "new").length, 0);
    return `<div class="v2-kpis"><div class="v2-kpi"><small>收緊報價</small><b>${open} 單</b></div><div class="v2-kpi"><small>未睇嘅報價同樣板</small><b>${replies}</b></div><div class="v2-kpi"><small>已請人</small><b>${hired} 單</b></div></div>`;
  }
  function offersHtml(n) {
    if (!n.offers.length) return `<div class="box thinking">${n.invited.length ? `已通知 ${n.invited.map(id => esc(talentById(id).name)).join("、")}，` : ""}等緊工作者報價。所有工作者都可以喺「搵工」見到呢個 job。</div>`;
    const best = n.offers.length > 1 ? n.offers.map(o => ({ o, m: match(n, talentById(o.talentId)).total })).sort((a, b) => b.m - a.m)[0].o.id : null;
    return `<div class="v2-quotes">${n.offers.map(o => {
      const t = talentById(o.talentId);
      const act = o.status === "accepted" ? `<span class="pill accepted">已接受</span>` : o.status === "declined" ? `<span class="pill declined">冇揀</span>`
        : n.status === "hired" ? "" : `<button type="button" class="btn btn-ghost btn-sm" data-offerchat="${o.id}">睇清楚</button><button type="button" class="btn btn-primary btn-sm" data-accept="${o.id}">接受</button>`;
      const top = o.id === best && n.status !== "hired";
      return `<div class="v2-q${top ? " top1" : ""}">${top ? `<span class="v2-flag">AI 推薦</span>` : ""}
        <button type="button" class="who" data-talent="${t.id}">${avatar(t)}<span><b>${esc(t.name)} ${tierBadge(t.tier)}</b><small>${ratingText(t)}</small></span></button>
        <div class="price">${hk(o.price)}<small>${o.days} 日交</small></div>
        <p>「${esc(o.msg)}」</p>
        ${o.files && o.files.length ? gallery(o.files, { limit: 3 }) : ""}
        <div class="btns">${act}</div>
      </div>`; }).join("")}</div>`;
  }

  function subsHtml(n) {
    if (!n.subs.length) return `<div class="box thinking">${n.invited.length ? `已通知 ${n.invited.map(id => esc(talentById(id).name)).join("、")}，` : ""}等緊工作者交試工樣板。所有工作者都可以喺「搵工」見到呢個 job。</div>`;
    return `<div class="subs">${n.subs.map(s => {
      const w = talentById(s.talentId);
      const act = s.status === "passed" ? `<span class="small muted">已略過</span>` : s.status === "picked" ? `<span class="pill accepted">已揀</span>`
        : n.status === "hired" ? "" : `<button type="button" class="btn btn-primary btn-sm" data-pick="${s.id}">揀佢，落實</button><button type="button" class="btn btn-ghost btn-sm" data-pass="${s.id}">唔啱</button>`;
      return `<article class="sub ${s.status}">

  // how complete your worker profile is, and the next things that get you picked
  function profileTodo(p) {
    const items = [
      ["填好級別同技能", !!(p.tier && p.skills && p.skills.length), ""],
      ["上載 3 件作品", worksOf(p).length >= 3, `<button type="button" class="btn btn-primary" data-works="1">加作品</button>`],
      ["設定檔期", p.avail && p.avail !== "off", ""],
    ];
    const pc = Math.round(100 * items.filter(x => x[1]).length / items.length);
    if (pc === 100) return "";
    return `<div class="v2-done"><div class="v2-pring" style="--p:${pc}"><b>${pc}%</b></div><p><b>檔案完成咗 ${pc}%</b>做埋下面幾樣，老闆揀人時排得前啲。</p></div>
      <ul class="v2-todo">${items.map(([t, ok, btn]) => `<li class="${ok ? "ok" : ""}"><span class="tick">${ok ? "✓" : ""}</span>${t}${ok ? "" : btn}</li>`).join("")}</ul>`;
  }

  async function runProfile() {
    const raw = $("#work-q").value.trim();
    if (!raw) { toast("請先講吓你識做咩"); $("#work-q").focus(); return; }
    $("#find-side").insertAdjacentHTML("beforeend", `<div class="box thinking">AI 整理緊你嘅檔案…</div>`);
    await wait(800);
    const cat = detectCat(raw), tier = suggestWorkerTier(raw);
    const skills = [...new Set(skillsIn(raw).concat(cat.skills.slice(0, 3)))].slice(0, 5);
    const exp = raw.match(/(\d+|[一兩二三四五六七八九十])\s*(年|間|單|個)/);
    const expText = exp ? ({ "年": `有 ${exp[1]} 年經驗`, "間": `幫過 ${exp[1]} 間公司同小店`, "單": `做過 ${exp[1]} 單` }[exp[2]] || `做過 ${exp[1]} 個客戶`) : "";
    const old = state.profile;
    state.profile = {
      id: "u:" + me(), raw, name: state.user ? state.user.name : "你", head: cat.name, cat: cat.id, tier, skills, rate: rateFor(tier, cat),
      rating: 4.5, done: 0, avail: old ? old.avail : "now", hue: state.user ? state.user.hue : "#17694F",
      photo: state.user ? state.user.photo : "", works: old ? worksOf(old) : [],
      bio: `專做${cat.name}，熟用 ${skills.slice(0, 3).join("、")}${expText ? "，" + expText : ""}。按時交貨，開工前先畀樣板睇方向。`,
    };
    saveMe();
    RENDER.find({});
    toast(old ? "已更新你嘅檔案" : "檔案建立咗，需求已按配對分排好");
    const pend = state.pending; state.pending = null;
    if (pend) (pend.type === "quote" ? openQuote : openSubmit)(pend.id);
  }

  function needProfile(type, id) {

  function orderAction(id, act) {
    const o = state.orders.find(x => x.id === id); if (!o) return;

      saveMe();
      toast("已加入作品集，客戶揀人時會見到");
      return refresh("work", "find");

      if (lk) { lk.status = 5; notify(lk.owner, `${state.user.name} 確認完成：${o.title}，可以互相評分`, "work"); }

  // 落實: agree on the amount and swap contacts; the money itself is between the two of them
  function showConfirm() {
    const c = state.chat;
    $("#chat-foot").innerHTML = `
      <div class="sum">
        <div><span class="muted">協定金額</span><span class="num">${hk(c.quote)}</span></div>
        <div><span class="muted">交貨</span><span>${c.days} 日內</span></div>
      </div>
      <p class="small muted">金額同付款方式由你同 ${esc(c.t.name)} 自行傾，平台唔經手、唔收費。落實之後你同 ${esc(c.t.name)} 會收到對方嘅 ${viaOf(c.need.contact ? c.need.contactVia : "wa").name}${c.need.contact ? "（你嘅係 " + esc(viaOf(c.need.contactVia).show(c.need.contact)) + "）" : ""}。</p>
      <button class="btn btn-primary" type="button" id="pay-go">落實，交換聯絡</button>`;
    $("#pay-go").addEventListener("click", () => {
      const { need, t, quote } = state.chat;
      need.status = "hired"; need.hiredWith = t.id;
      const o = need.offers.find(x => x.talentId === t.id); if (o) o.status = "accepted";
      const s = need.subs.find(x => x.talentId === t.id); if (s) s.status = "picked";
      // everyone else who replied hears they were not picked
      need.offers.filter(x => x !== o && x.status === "new").forEach(x => {
        x.status = "declined";
        const q = state.quotes.find(y => y.id === x.quoteId);
        if (q) { q.status = "declined"; notify(q.owner, `${who(need.client)} 揀咗其他人：${need.title}`, "sent"); }
      });
      need.subs.filter(x => x !== s && x.status === "new").forEach(x => {
        x.status = "passed";
        const ms = state.subs.find(y => y.id === x.subId);
        if (ms) { ms.status = "declined"; notify(ms.owner, `${who(need.client)} 揀咗其他人：${need.title}`, "sent"); }
      });
      const bo = { id: "o" + Date.now(), owner: me(), side: "boss", title: need.title, partner: t.name, amount: quote, status: 2, rating: 0 };
      state.orders.push(bo);
      if (t.id.startsWith("u:")) {
        const wEmail = t.id.slice(2), w = known[wEmail] ? known[wEmail].user : {};
        const wo = { id: "o" + (Date.now() + 1), owner: wEmail, side: "worker", title: need.title, partner: need.client, amount: quote, status: 2, rating: 0, link: bo.id,
          contactVia: need.contact ? (need.contactVia || "wa") : "wa", contact: need.contact || state.user.phone };

        bo.link = wo.id; bo.contactVia = wo.contactVia; bo.contact = handleOf(w, wo.contactVia) || "";
        state.orders.push(wo);
        const q = o && state.quotes.find(x => x.id === o.quoteId); if (q) q.status = "accepted";
        const ms = s && state.subs.find(x => x.id === s.subId); if (ms) ms.status = "picked";
        notify(wEmail, `${who(need.client)} 揀咗你：${need.title}，可以開工`, "work");
      }
      closeDrawer();
      toast(`已落實，${t.name} 可以開工，聯絡已經交換`);
      go("hired");
    });

  // ---------- events ----------
  document.addEventListener("click", e => {
    let b = e.target.closest("button");
    // tapping anywhere on a job or a person opens it, like its picture
    if (!b) { const row = e.target.closest(".v2row"); if (row && !e.target.closest("a")) b = row.querySelector(".v2-pic"); }
    if (b) handle(b, { ...b.dataset });
  });
  function handle(b, d) {
    if (d.memos !== undefined || d.memox || d.memogo) return memoAction(d);
    if (d.openfilter !== undefined) return openFilter();
    if (d.tiers !== undefined) return openTiers();
    if (d.proftoggle !== undefined) return foldProf(b.closest(".prof").classList.contains("folded"));
    if (d.lb) return openLB(d.lb);
    if (d.lbclose !== undefined) return closeLB();
    if (d.lbgo) return stepLB(+d.lbgo);
    if (d.close !== undefined) return closeDrawer();
    if (d.loginclose !== undefined) return closeLogin();
    if (d.gacc) return signIn(DEMO_ACCOUNTS[+d.gacc]);
    if (d.me !== undefined) return openAccount();
    if (d.notes !== undefined) return openNotes();
    if (d.notego) { closeDrawer(); return go(d.notego); }
    if (d.logout !== undefined) return signOut();
    if (LOGIN_ACTIONS.some(k => d[k] !== undefined) && !signedUp()) {
      return requireLogin(() => handle(b, d), LOGIN_ACTIONS.find(k => d[k] !== undefined));
    }
    if (d.role) { const v = d.role === "boss" ? (signedUp() && myNeeds().some(n => !n.example) ? "needs" : "post") : "find"; return go(v); }
    if (d.go) { closeDrawer(); return go(d.go); }
    if (d.job) return showJob(d.job);
    if (d.talent) return showTalent(d.talent);
    if (d.fill) { const q = document.getElementById(d.fill); q.value = d.text; q.focus(); return; }
    if (d.tier && !b.closest("#drawer")) { state.tier = state.tier === d.tier && b.classList.contains("tier-card") ? "all" : d.tier; return RENDER[state.view]({}); }
    if (d.filter || d.sortby || d.look || (d.tier && b.closest("#drawer"))) {
      if (d.filter) state.filter = d.filter;
      if (d.sortby) state.sort = d.sortby;
      if (d.look) state.look = d.look;
      if (d.tier) state.tier = d.tier;
      RENDER[state.view]({});
      if (b.closest("#drawer")) openFilter();
      return;
    }
    // 發 job draft
    if (d.autofill !== undefined) return autoFill();
    // on a phone the job form folds away under its heading until tapped
    if (d.formtoggle !== undefined) { if (innerWidth > 980) return; return foldForm(!state.formOpen); }
    if (d.dcat) { readDraft(); const dr = state.draft, c = catById(d.dcat); dr.cat = c.id; dr.touched = true;
      if (dr.budgetGuess) dr.budget = c.median; dr.skills = c.skills.slice(0, 3); dr.trial.brief = TRIAL_EG[c.id]; return renderDraft(false); }
    if (d.dtier) { readDraft(); state.draft.tier = d.dtier; state.draft.touched = true; return renderDraft(false); }
    // 我發嘅 job
    if (d.need) { state.selNeed = d.need; state.needTab = "replies"; return RENDER.needs(); }
    if (d.ntab) { state.needTab = d.ntab; return RENDER.needs(); }
    if (d.invite) {
      const n = needById(state.selNeed); invite(n, [d.invite]); closeDrawer();
      toast(`已邀請 ${talentById(d.invite).name}${n.mode === "trial" ? "試工" : "報價"}`); return RENDER.needs();
    }
    if (d.accept || d.offerchat) {
      const n = needById(state.selNeed), o = n.offers.find(x => x.id === (d.accept || d.offerchat)), t = talentById(o.talentId);
      if (d.offerchat) return openChat(n, t, o.price);
      return hireFrom(n, t, o.price, `你接受咗 ${t.name} 嘅報價 ${hk(o.price)}，落實之後交換聯絡就可以開工。`);
    }
    if (d.pick) {
      const n = needById(state.selNeed), s = n.subs.find(x => x.id === d.pick), t = talentById(s.talentId);
      return hireFrom(n, t, quoteFor(n, t), `你揀咗 ${t.name} 嘅試工樣板，確認報價就可以落實。`);
    }
    if (d.pass) { needById(state.selNeed).subs.find(x => x.id === d.pass).status = "passed"; return RENDER.needs(); }
    // 搵工
    if (d.quote) { if (!needProfile("quote", d.quote)) openQuote(d.quote); return; }
    if (d.trial) { if (!needProfile("trial", d.trial)) openSubmit(d.trial); return; }
    // changing skills, level or intro happens on the details page, the same place as 修改資料
    if (d.editprofile) return startEditMe();
    if (d.gologin !== undefined && state.view === "login" && $("#setup-form")) return pointSetup();
    if (d.gologin !== undefined) return requireLogin(() => {}, state.view === "find" ? "profile" : "publish");
    if (d.joinwork !== undefined) return requireLogin(() => { if (!state.profile) startAddWorker(); }, "profile");
    if (d.addworker !== undefined) return startAddWorker();
    if (d.editme !== undefined) return startEditMe();
    if (d.joinhire !== undefined) return requireLogin(() => {}, "publish");
    if (d.works) return openWorks();
    if (d.unphoto !== undefined) { state.user.photo = state.user.gphoto || ""; saveMe(); renderAccount(); RENDER[state.view]({}); toast("用返 Google 頭像"); return openAccount(); }
    if (d.ptier) { const p = state.profile; p.tier = d.ptier; p.rate = rateFor(p.tier, catById(p.cat)); return RENDER.find({}); }
    if (d.avail) { state.profile.avail = d.avail; return RENDER.find({}); }
    // 進行中
    if (d.order && d.act) return orderAction(d.order, d.act);
    if (d.review) return openReview(d.review);
  }
  $("#scrim").addEventListener("click", closeDrawer);

  // ---------- back end: records and files are kept on the Mac when the page can reach it ----------
  // served from the Mac itself (local test) it talks to the same address; on GitHub Pages it uses the tunnel address
  const BACKEND_URL = "https://rexmb.tail2f3ae7.ts.net";
  const API = (() => {
    const h = location.hostname;
    if (/^https?:$/.test(location.protocol) && (h === "localhost" || h === "127.0.0.1")) return location.origin;
    if (h === "rexvanrs24.github.io") return BACKEND_URL;
    return "";
  })();
  const canUpload = () => !!(API && me());
  // Google login: the server checks Google's token and gives back a session kept in this browser
  const CFG = { google: "", demo: !API };
  let session = null;
  try { session = JSON.parse(localStorage.getItem("aipd-session") || "null"); } catch (e) {}
  const realLogin = () => !!(API && CFG.google);
  const authHeaders = () => session && session.token ? { Authorization: "Bearer " + session.token } : (CFG.demo && me() ? { "X-User": me() } : {});
  const HUES = ["#B4532E", "#3E6FA8", "#2E7D5B", "#8A5A12", "#6A4E8C", "#8A3F5C", "#2E6B7A"];
  const hueFor = email => HUES[[...email].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
  function loadGoogle() {
    if (window.google && google.accounts) return Promise.resolve();
    return new Promise((ok, bad) => {
      const sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client?hl=zh-TW"; sc.async = true; sc.onload = ok; sc.onerror = bad;
      document.head.appendChild(sc);
    });
  }
  async function mountGoogle() {
    const box = $("#g-btn"); if (!box) return;
    try {
      await loadGoogle();
      google.accounts.id.initialize({ client_id: CFG.google, callback: onGoogle, ux_mode: "popup" });
      google.accounts.id.renderButton(box, { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "zh-TW", width: Math.min(360, box.clientWidth || 320) });
    } catch (e) { box.innerHTML = `<p class="err">連唔到 Google 登入，請檢查網絡再重新整理。</p>`; }
  }
  async function onGoogle(resp) {
    try {
      const r = await fetch(API + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
      if (!r.ok) throw new Error("login " + r.status);
      const j = await r.json();
      session = { token: j.token, email: j.email };
      try { localStorage.setItem("aipd-session", JSON.stringify(session)); } catch (e) {}
      // read this account's saved details first, so a returning person skips the setup form
      since = 0;
      try { await pull(); } catch (e) {}
      signIn({ name: j.name, email: j.email, hue: hueFor(j.email), photo: j.picture || "", gphoto: j.picture || "" });
    } catch (e) { toast("Google 登入未成功，請再試一次"); }
  }
  // the server no longer accepts this login (expired or signed out elsewhere)
  function loginExpired() {
    session = null;
    try { localStorage.removeItem("aipd-session"); } catch (e) {}
    if (state.user) { toast("登入已經過期，請再登入"); signOut(true); }
  }
  async function uploadBlob(blob, name) {
    const r = await fetch(API + "/api/files", { method: "POST", body: blob,
      headers: { "Content-Type": blob.type || "application/octet-stream", ...authHeaders(), "X-Filename": encodeURIComponent(name) } });
    if (!r.ok) throw new Error("upload " + r.status);
    return API + (await r.json()).url;
  }
  const SYNCED = { needs: () => state.needs, quotes: () => state.quotes, subs: () => state.subs, orders: () => state.orders, notes: () => state.notes };
  const sent = {};       // "coll:id" -> the record as last saved or received
  let since = 0, online = null, syncing = false;
  // file links are stored with the address they were uploaded to; point them at the current one
  const fixUrls = text => text.replace(/https?:\/\/[^"\\\s]*?\/files\/(?=[0-9a-f]{32}\.)/g, API + "/files/");
  function setOnline(ok) {
    if (online === ok) return;
    if (online !== null) toast(ok ? "已經連返後台" : "連唔到後台，新資料暫時只存喺呢部機");
    online = ok;
  }
  async function push() {
    if (!signedUp()) return;
    const jobs = [];
    for (const [coll, get] of Object.entries(SYNCED)) for (const x of get()) {
      if (x.example || !(x.owner || x.to)) continue;
      const text = JSON.stringify(x), key = coll + ":" + x.id;
      if (sent[key] !== text) jobs.push([coll, x.id, text, key]);
    }
    const mine = JSON.stringify({ id: me(), user: state.user, profile: state.profile });
    if (sent["users:" + me()] !== mine) jobs.push(["users", me(), mine, "users:" + me()]);
    for (const [coll, id, text, key] of jobs) {
      const r = await fetch(`${API}/api/rec/${coll}/${encodeURIComponent(id)}`, { method: "PUT", body: text, headers: { "Content-Type": "application/json", ...authHeaders() } });
      if (r.ok) sent[key] = text;
      else if (r.status === 401 && session) return loginExpired();
    }
  }
  async function pull() {
    const r = await fetch(`${API}/api/state?since=${since}`, { headers: authHeaders(), cache: "no-store" });
    if (r.status === 401 && session) { loginExpired(); return; }
    if (!r.ok) throw new Error("state " + r.status);
    const j = JSON.parse(fixUrls(await r.text()));
    let changed = false;
    for (const { coll, data } of j.recs) {
      const key = coll + ":" + data.id;
      if (coll === "users") {
        const email = String(data.id).toLowerCase();
        if (email === me()) {
          // your own account: take the saved copy unless you changed something here that is not saved yet
          if (sent[key] !== undefined && JSON.stringify({ id: me(), user: state.user, profile: state.profile }) !== sent[key]) continue;
          const was = JSON.stringify([state.user, state.profile]);
          if (data.user) Object.assign(state.user, data.user);
          if (data.profile) state.profile = state.profile ? Object.assign(state.profile, data.profile) : data.profile;
          sent[key] = JSON.stringify({ id: me(), user: state.user, profile: state.profile });
          // your own details changed (for example the saved copy says you finished signing up): redraw the header too
          if (JSON.stringify([state.user, state.profile]) !== was) {
            changed = true;
            try { localStorage.setItem("aipd-user", JSON.stringify(state.user)); } catch (e) {}
          }
        }
        const before = JSON.stringify(known[email] || null);
        known[email] = { user: data.user, profile: data.profile };
        if (before !== JSON.stringify(known[email])) changed = true;
        continue;
      }
      const list = SYNCED[coll] && SYNCED[coll](); if (!list) continue;
      const local = list.find(x => x.id === data.id);
      if (local) {
        const now = JSON.stringify(local);
        if (sent[key] !== undefined && now !== sent[key]) continue;   // changed here, not saved yet: keep ours
        if (now !== JSON.stringify(data)) { Object.assign(local, data); changed = true; }
        sent[key] = JSON.stringify(local);
      } else {
        if (coll === "needs") list.unshift(data); else list.push(data);
        sent[key] = JSON.stringify(data);
        changed = true;
      }
    }
    since = j.now;
    if (fillContacts()) changed = true;
    if (changed) {
      saveKnown();
      renderNav(); renderAccount();
      const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
      if ($("#drawer").hidden && !typing && state.view !== "login" && !LB) RENDER[state.view]({});
    }
  }
  // the client's copy of a job gets the worker's WhatsApp once the server lets it through
  function fillContacts() {
    let any = false;
    state.orders.filter(o => ownedBy(o) && o.link && !o.contact).forEach(o => {
      const lk = state.orders.find(x => x.id === o.link), k = lk && known[String(lk.owner || "").toLowerCase()];
      if (!k || !k.user) return;
      // their account on the job's app; someone who quoted before accounts were asked for falls back to WhatsApp
      const h = handleOf(k.user, o.contactVia || "wa");
      if (h) { o.contact = h; any = true; }
      else if (k.user.phone) { o.contactVia = "wa"; o.contact = k.user.phone; any = true; }
    });
    return any;
  }
  async function syncNow() {
    if (!API || syncing) return;
    syncing = true;
    try { await push(); await pull(); setOnline(true); }
    catch (e) { setOnline(false); }
    finally { syncing = false; }
  }
  // a different person logged in: start again from everything they are allowed to see
  function resync() {
    since = 0;
    syncNow();
  }
  async function startSync() {
    if (!API) return;
    try {
      const c = await (await fetch(API + "/api/config", { cache: "no-store" })).json();
      CFG.google = c.google_client_id || ""; CFG.demo = !!c.demo;
    } catch (e) {}
    // on the real site a saved login without its server session is not a login
    if (realLogin() && state.user && !session && !CFG.demo) { state.user = null; state.profile = null; }
    // this browser remembers an older account than the one Google logged in: follow the Google login
    if (session && session.email && state.user && String(state.user.email).toLowerCase() !== session.email) {
      const back = known[session.email];
      state.user = back && back.user ? { ...back.user } : { name: "", email: session.email, hue: hueFor(session.email) };
      state.profile = back && back.profile ? back.profile : null;
      try { localStorage.setItem("aipd-user", JSON.stringify(state.user)); } catch (e) {}
    }
    // draw the page again now that it is known whether you are logged in
    renderAccount();
    go(PRIVATE.includes(state.view) && !signedUp() ? "login" : state.view);
    syncNow();
    setInterval(syncNow, 3000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  }

  // ---------- 說明 under the bar: change the text (and its date) and it shows again for everyone ----------
  // notes under the bar, top to bottom; each one stays closed once its × is pressed, until its id changes
  const MEMOS = [
    { id: "info-2026-11-03", tag: "說明", text: "AI拍檔試用緊：用 Google 登入，就可以發 job、報價同上載作品。平台只做配對，金額同付款方式由雙方自己傾。有問題或者建議，歡迎話我哋知。" },
    { id: "need-2026-11-04c", tag: "而家最需要", kind: "need", text: "AI 搵客：用 AI 喺網上搵出有興趣嘅客，再引佢哋去 WhatsApp 或者落單頁成交，用最少錢搵最多客。識做嘅人，而家最多老闆搵。",
      go: { label: "睇搵客 job", view: "find", filter: "leads" } },
  ];
  function closedMemos() {
    try { return JSON.parse(localStorage.getItem("aipd-memos-closed") || "[]"); } catch (e) { return []; }
  }
  function showMemo() {
    const closed = closedMemos();
    const list = MEMOS.filter(m => m.text && !closed.includes(m.id));
    // the most useful notice leads the line; the full text of all of them is one tap away
    const lead = list.find(m => m.kind === "need") || list[0];
    $("#memos").innerHTML = lead ? `<div class="wrap"><button type="button" class="memo-line" data-memos><i class="dot" aria-hidden="true"></i><span><b>${esc(lead.tag)}：</b>${esc(lead.text)}</span><small>${list.length > 1 ? list.length + " 則 ›" : "›"}</small></button></div>` : "";
  }
  function openMemos() {
    const closed = closedMemos(), list = MEMOS.filter(m => m.text && !closed.includes(m.id));
    if (!list.length) return closeDrawer();
    openDrawer(`${head("消息")}
      <div class="drawer-body">${list.map(m => `<div class="memo-card ${m.kind || ""}"><span class="memo-tag">${esc(m.tag)}</span><p>${esc(m.text)}</p>
        <div class="btns">${m.go ? `<button type="button" class="btn btn-primary btn-sm" data-memogo="${m.id}">${esc(m.go.label)}</button>` : ""}<button type="button" class="btn btn-ghost btn-sm" data-memox="${m.id}">知道，唔使再顯示</button></div></div>`).join("")}</div>`);
  }
  function memoAction(d) {
    if (d.memos !== undefined) return openMemos();
    if (d.memox) {
      const list = closedMemos().concat(d.memox);
      try { localStorage.setItem("aipd-memos-closed", JSON.stringify(list)); } catch (err) {}
      showMemo(); return openMemos();
    }
    if (d.memogo) {
      const m = MEMOS.find(y => y.id === d.memogo);
      closeDrawer(); go(m.go.view); state.filter = m.go.filter; RENDER[state.view]({});
    }
  }


  // ---------- examples so each page has something to show ----------
  (function seed() {
    TALENT.forEach((t, i) => { t.works = WORK_CAPS[t.cat].map((cap, k) => ({ ...demoFile(cap, k % 2 ? CAT_HUE[t.cat] : t.hue, i * 7 + k) })); });
    JOBS.forEach((j, i) => {
      j.refs = REF_EG[j.cat].map((n, k) => demoFile(n, CAT_HUE[j.cat], i * 5 + k));
      if (j.trial) j.trial.files = (j.trial.refs || []).map((n, k) => demoFile(n, CAT_HUE[j.cat], i * 3 + k + 50));
    });
  })();

  try { const u = JSON.parse(localStorage.getItem("aipd-user") || "null"); if (u && u.name) { state.user = u; if (known[u.email]) { state.profile = known[u.email].profile; if (state.profile) state.profile.id = "u:" + u.email; } } } catch (e) {}
  renderAccount();
  go(location.hash.slice(1) || "home");
  showMemo();
  startSync();
})();
</script>
